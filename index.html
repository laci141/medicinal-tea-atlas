, infuzare acoperită 8–10 minute.","clinical":"Extractul de sunătoare este una dintre cele mai bine studiate plante medicinale în depresie. Conform unei sinteze Cochrane (29 de studii), extractele sunt mai eficiente decât placebo, la fel de eficiente ca antidepresivele standard și au mai puține efecte secundare – efectul este clar în special în depresia ușoară–moderată, iar în depresia severă este mai variabil.","warn":"⚠️ AVERTISMENT SERIOS: sunătoarea slăbește efectul multor medicamente (de ex. contraceptive, anticoagulante, unele antidepresive, imunosupresoare). În cazul administrării de medicamente, numai după consultarea medicului!"},"en":{"name":"St. John's wort","role":"Mood · depression","hatas":"Mild to moderate depression, low mood. A regionally important medicinal herb.","prep":"1–2 teaspoons of dried flowering tops per cup, water at ~100 °C, steep covered for 8–10 minutes.","clinical":"St. John's wort extract is one of the best-studied medicinal herbs in depression. According to a Cochrane review (29 trials), the extracts are more effective than placebo, similarly effective to standard antidepressants, and have fewer side effects – the effect is clearest particularly in mild to moderate depression, while in severe depression it is more mixed.","warn":"⚠️ SERIOUS WARNING: St. John's wort weakens the effect of many medications (e.g. contraceptives, anticoagulants, certain antidepressants, immunosuppressants). While taking medication, only after consulting a doctor!"},"de":{"name":"Johanniskraut","role":"Stimmung · Depression","hatas":"Leichte bis mittelschwere Depression, gedrückte Stimmung. Regional wichtige Heilpflanze.","prep":"1–2 Teelöffel getrocknete blühende Triebe pro Tasse, Wasser mit ~100 °C, 8–10 Minuten abgedeckt ziehen lassen.","clinical":"Johanniskraut-Extrakt ist eine der am besten untersuchten Heilpflanzen bei Depression. Laut einer Cochrane-Übersicht (29 Studien) sind die Extrakte wirksamer als Placebo, ähnlich wirksam wie Standard-Antidepressiva und haben weniger Nebenwirkungen – die Wirkung ist vor allem bei leichter bis mittelschwerer Depression eindeutig, bei schwerer Depression uneinheitlicher.","warn":"⚠️ ERNSTE WARNUNG: Johanniskraut schwächt die Wirkung zahlreicher Medikamente (z. B. Verhütungsmittel, Blutgerinnungshemmer, einige Antidepressiva, Immunsuppressiva). Bei gleichzeitiger Medikamenteneinnahme nur nach Rücksprache mit dem Arzt!"}},"11":{"ro":{"name":"Tei","role":"Răceală · calmare","hatas":"Răceală, transpirație (la febră), calmare, tulburări ușoare de somn.","prep":"1–2 lingurițe de flori de tei uscate la o cană, apă la ~100 °C, infuzare acoperită 10 minute.","tradText":"Floarea de tei este folosită în mod tradițional pentru răceală, pentru stimularea transpirației și pentru calmare ușoară; monografiile europene de plante medicinale o recunosc ca plantă de uz tradițional. Există însă abia câteva studii clinice randomizate mari și de bună calitate – dovezile se bazează în principal pe utilizarea tradițională și pe date de laborator."},"en":{"name":"Linden","role":"Cold · calming","hatas":"Cold, sweating (with fever), calming, mild sleep disturbances.","prep":"1–2 teaspoons of dried linden flowers per cup, water at ~100 °C, steep covered for 10 minutes.","tradText":"Linden flower is traditionally used for colds, to promote sweating and for mild calming; European herbal monographs recognize it as a plant of traditional use. However, there are hardly any large, good-quality randomized clinical trials – the evidence is based mainly on traditional use and laboratory data."},"de":{"name":"Linde","role":"Erkältung · Beruhigung","hatas":"Erkältung, Schwitzen (bei Fieber), Beruhigung, leichte Schlafstörungen.","prep":"1–2 Teelöffel getrocknete Lindenblüten pro Tasse, Wasser mit ~100 °C, 10 Minuten abgedeckt ziehen lassen.","tradText":"Die Lindenblüte wird traditionell bei Erkältung, zum Schwitzen (schweißtreibend) und zur leichten Beruhigung verwendet; europäische Pflanzenmonographien erkennen sie als Pflanze der traditionellen Anwendung an. Große, hochwertige randomisierte klinische Studien gibt es jedoch kaum – die Evidenz beruht überwiegend auf traditioneller Anwendung und Labordaten."}},"12":{"ro":{"name":"Cozi de vișine","role":"Diuretic · căi urinare","hatas":"Efect diuretic, afecțiuni urinare și articulare (uz popular).","prep":"Un pumn de cozi de vișine uscate în ~0,5 l de apă, fierbere 5–10 minute (decoct), apoi strecurare.","tradText":"Cozile (pedunculii) de vișine sunt folosite în medicina populară ca diuretic, pentru afecțiuni urinare și articulare. Pentru ceaiul preparat din cozi practic nu există niciun studiu clinic la om. (Notă: efectele sucului de vișine – nu ale cozilor – asupra sistemului cardio-metabolic și asupra somnului au fost studiate separat, cu rezultate favorabile.)"},"en":{"name":"Sour cherry stems","role":"Diuretic · urinary tract","hatas":"Diuretic effect, urinary and joint complaints (folk use).","prep":"A handful of dried sour cherry stems in ~0.5 l of water, boil for 5–10 minutes (decoction), then strain.","tradText":"Sour cherry stems (stalks) are used in folk medicine as a diuretic and for urinary and joint complaints. There are practically no human clinical trials on tea made from the stems. (Note: the cardio-metabolic and sleep effects of cherry juice – not the stems – have been studied separately, with favorable results.)"},"de":{"name":"Sauerkirschstiele","role":"Harntreibend · Harnwege","hatas":"Harntreibende Wirkung, Harnwegs- und Gelenkbeschwerden (Volksheilkunde).","prep":"Eine Handvoll getrocknete Sauerkirschstiele in ~0,5 l Wasser, 5–10 Minuten kochen (Dekokt), dann abseihen.","tradText":"Die Sauerkirschstiele (Stiele) werden in der Volksheilkunde als Harntreibendes Mittel sowie bei Harnwegs- und Gelenkbeschwerden verwendet. Zu dem aus den Stielen zubereiteten Tee gibt es praktisch keine klinischen Studien am Menschen. (Anmerkung: Die kardiometabolischen und schlafbezogenen Wirkungen des Kirschsafts – nicht der Stiele – wurden gesondert untersucht, mit günstigen Ergebnissen.)"}},"13":{"ro":{"name":"Roiniță","role":"Calmare · somn","hatas":"Anxietate, stres, somn, dispoziție, digestie.","prep":"1–2 lingurițe de frunze uscate la o cană, apă la ~100 °C, infuzare acoperită 5–10 minute. Excelentă și proaspătă.","clinical":"Conform unei metaanalize, roinița a îmbunătățit semnificativ scorurile de anxietate și depresie față de placebo (diferență medie standardizată de aproximativ −0,98). În studii randomizate (de ex. după operație pe cord) a redus anxietatea și a îmbunătățit calitatea somnului; studii mici au arătat efecte favorabile și asupra dispoziției și performanței cognitive, printr-un mecanism mediat de sistemul GABA. Pentru tulburările de somn a fost adesea studiată în combinație cu valeriană (odolean)."},"en":{"name":"Lemon balm","role":"Calming · sleep","hatas":"Anxiety, stress, sleep, mood, digestion.","prep":"1–2 teaspoons of dried leaf per cup, water at ~100 °C, steep covered for 5–10 minutes. Excellent fresh as well.","clinical":"According to a meta-analysis, lemon balm significantly improved anxiety and depression scores compared with placebo (standardized mean difference about −0.98). In randomized trials (e.g. after cardiac surgery) it reduced anxiety and improved sleep quality; small trials also showed favorable effects on mood and cognitive performance, acting through the GABA system. For sleep disturbances it has often been studied in combination with valerian."},"de":{"name":"Zitronenmelisse","role":"Beruhigung · Schlaf","hatas":"Angst, Stress, Schlaf, Stimmung, Verdauung.","prep":"1–2 Teelöffel getrocknete Blätter pro Tasse, Wasser mit ~100 °C, 5–10 Minuten abgedeckt ziehen lassen. Auch frisch hervorragend.","clinical":"Laut einer Metaanalyse verbesserte die Zitronenmelisse die Angst- und Depressionswerte signifikant gegenüber Placebo (standardisierte Mittelwertdifferenz etwa −0,98). In randomisierten Studien (z. B. nach Herzoperationen) verringerte sie die Angst und verbesserte die Schlafqualität; kleine Studien zeigten auch günstige Wirkungen auf Stimmung und kognitive Leistung über das GABA-System. Bei Schlafstörungen wurde sie häufig in Kombination mit Baldrian untersucht."}},"14":{"ro":{"name":"Măceșe","role":"Articulații · vitamina C","hatas":"Durere articulară (artroză), vitamina C, imunitate.","prep":"1–2 lingurițe de măceșe uscate și sfărâmate la o cană, apă la ~100 °C, infuzare acoperită 10–15 minute (o infuzare mai lungă extrage mai multă vitamina C).","clinical":"Conform metaanalizei a 3 studii randomizate (287 de pacienți, ~3 luni), pulberea de măceșe a redus mai bine decât placebo durerea din artroza (osteoartrita) șoldului și genunchiului (mărimea efectului 0,37), iar răspunsul terapeutic a fost de aproximativ două ori mai probabil (NNT ≈ 6). Studiile au fost sponsorizate de producător și cu eșantioane mici – ar fi nevoie de un studiu independent și amplu pentru confirmare. În plus, măceșele sunt deosebit de bogate în vitamina C."},"en":{"name":"Rosehip","role":"Joints · vitamin C","hatas":"Joint (osteoarthritis) pain, vitamin C, immunity.","prep":"1–2 teaspoons of dried, crushed rosehip per cup, water at ~100 °C, steep covered for 10–15 minutes (longer steeping extracts more vitamin C).","clinical":"According to a meta-analysis of 3 randomized trials (287 patients, ~3 months), rosehip powder reduced hip and knee osteoarthritis pain better than placebo (effect size 0.37), and a therapeutic response was about twice as likely (NNT ≈ 6). The trials were manufacturer-sponsored and small – an independent, large trial would be needed for confirmation. Rosehip is also exceptionally rich in vitamin C."},"de":{"name":"Hagebutte","role":"Gelenke · Vitamin C","hatas":"Gelenkschmerzen (Arthrose), Vitamin C, Immunsystem.","prep":"1–2 Teelöffel getrocknete, zerkleinerte Hagebutten pro Tasse, Wasser mit ~100 °C, 10–15 Minuten abgedeckt ziehen lassen (längeres Ziehen löst mehr Vitamin C heraus).","clinical":"Laut einer Metaanalyse von 3 randomisierten Studien (287 Patienten, ~3 Monate) verringerte Hagebuttenpulver die Schmerzen bei Hüft- und Kniearthrose (Osteoarthrose) besser als Placebo (Effektstärke 0,37), und ein therapeutisches Ansprechen war etwa doppelt so wahrscheinlich (NNT ≈ 6). Die Studien waren herstellerfinanziert und klein – zur Bestätigung wäre eine unabhängige, große Studie nötig. Zudem ist die Hagebutte außergewöhnlich reich an Vitamin C."}},"15":{"ro":{"name":"Coada-șoricelului","role":"Digestie · răni","hatas":"Tulburări digestive, apetit, crampe ușoare, răni, menstruație (uz popular).","prep":"1–2 lingurițe de plantă înflorită uscată la o cană, apă la ~100 °C, infuzare acoperită 10 minute.","tradText":"Coada-șoricelului este folosită în medicina populară pentru tulburări digestive, lipsa poftei de mâncare, crampe ușoare, răni și tulburări menstruale; monografiile europene o recunosc ca plantă de uz tradițional. Există însă abia câteva studii randomizate la om, mari și de bună calitate – dovezile se bazează în principal pe utilizarea tradițională și pe date de laborator."},"en":{"name":"Yarrow","role":"Digestion · wounds","hatas":"Digestive complaints, appetite, mild cramps, wounds, menstruation (folk use).","prep":"1–2 teaspoons of dried flowering herb per cup, water at ~100 °C, steep covered for 10 minutes.","tradText":"Yarrow is used in folk medicine for digestive complaints, loss of appetite, mild cramps, wounds and menstrual complaints; European monographs recognize it as a plant of traditional use. However, there are hardly any large, good-quality randomized human trials – the evidence is based mainly on traditional use and laboratory data."},"de":{"name":"Schafgarbe","role":"Verdauung · Wunden","hatas":"Verdauungsbeschwerden, Appetit, leichte Krämpfe, Wunden, Menstruation (Volksheilkunde).","prep":"1–2 Teelöffel getrocknetes blühendes Kraut pro Tasse, Wasser mit ~100 °C, 10 Minuten abgedeckt ziehen lassen.","tradText":"Die Schafgarbe wird in der Volksheilkunde bei Verdauungsbeschwerden, Appetitlosigkeit, leichten Krämpfen, Wunden und Menstruationsbeschwerden verwendet; europäische Monographien erkennen sie als Pflanze der traditionellen Anwendung an. Große, hochwertige randomisierte Studien am Menschen gibt es jedoch kaum – die Evidenz beruht überwiegend auf traditioneller Anwendung und Labordaten."}},"16":{"ro":{"name":"Hibiscus","role":"Tensiune arterială · fără cofeină","hatas":"Scăderea tensiunii arteriale, antioxidant, acrișor, fără cofeină.","prep":"1–2 lingurițe de flori uscate (caliciul florii) la o cană, apă la ~100 °C, 5–10 minute. Delicios și rece (ca ceai cu gheață).","clinical":"Conform metaanalizei a 17 studii randomizate, ceaiul/extractul de hibiscus a scăzut tensiunea arterială sistolică mai bine decât placebo (în medie cu aproximativ −7 mmHg), iar efectul este cel mai mare la persoanele cu tensiune arterială mai ridicată. În unele studii a avut efect favorabil și asupra profilului lipidic și a glicemiei. Plăcut acrișor și fără cofeină.","warn":"⚠️ Alături de un medicament hipotensor poate amplifica efectul (tensiune prea scăzută). În cazul administrării de medicamente, este recomandată consultarea medicului."},"en":{"name":"Hibiscus","role":"Blood pressure · caffeine-free","hatas":"Blood pressure lowering, antioxidant, tart, caffeine-free.","prep":"1–2 teaspoons of dried flowers (the flower's calyx) per cup, water at ~100 °C, 5–10 minutes. Also delicious cold (as iced tea).","clinical":"According to a meta-analysis of 17 randomized trials, hibiscus tea/extract lowered systolic blood pressure better than placebo (on average by about −7 mmHg), and the effect is greatest in people with higher blood pressure. In some trials it also had a favorable effect on the lipid profile and blood glucose. Pleasantly tart and caffeine-free.","warn":"⚠️ Alongside a blood-pressure-lowering medication it may amplify the effect (blood pressure too low). If taking medication, it is advisable to consult a doctor."},"de":{"name":"Hibiskus","role":"Blutdruck · koffeinfrei","hatas":"Blutdrucksenkung, Antioxidans, säuerlich, koffeinfrei.","prep":"1–2 Teelöffel getrocknete Blüten (Kelchblätter der Blüte) pro Tasse, Wasser mit ~100 °C, 5–10 Minuten. Auch kalt (als Eistee) köstlich.","clinical":"Laut einer Metaanalyse von 17 randomisierten Studien senkte Hibiskustee/-extrakt den systolischen Blutdruck besser als Placebo (im Durchschnitt um etwa −7 mmHg), und die Wirkung ist bei Menschen mit höherem Blutdruck am größten. In einigen Studien wirkte er sich auch günstig auf das Lipidprofil und den Blutzucker aus. Angenehm säuerlich und koffeinfrei.","warn":"⚠️ Zusammen mit einem blutdrucksenkenden Medikament kann er die Wirkung verstärken (zu niedriger Blutdruck). Bei Medikamenteneinnahme ist eine Rücksprache mit dem Arzt ratsam."}},"17":{"ro":{"name":"Ginseng","role":"Oboseală · glicemie","hatas":"Oboseală, energie, glicemie, memorie (adaptogen).","prep":"1 linguriță de rădăcină uscată, feliată la o cană, apă la ~90 °C, infuzare 5–10 minute sau fierbere scurtă. Recomandat dimineața/înainte de prânz.","clinical":"Panax ginseng este unul dintre cei mai studiați adaptogeni. Pentru oboseală, conform unei sinteze sistematice (8 RCT), a fost mai bun decât placebo pe scalele de oboseală și în efectul clinic. Pentru glicemie, conform metaanalizei a 16 RCT, a scăzut ușor glicemia à jeun. Studii mici au arătat semne favorabile și asupra memoriei/dispoziției și a disfuncției erectile. Datele privind tensiunea arterială sunt variabile.","warn":"⚠️ Poate fi stimulant (insomnie, neliniște) și interacționează, de exemplu, cu anticoagulantele și cu medicamentele pentru diabet. În caz de hipertensiune sau de administrare de medicamente, numai după consultarea medicului."},"en":{"name":"Ginseng","role":"Fatigue · blood glucose","hatas":"Fatigue, energy, blood glucose, memory (adaptogen).","prep":"1 teaspoon of dried, sliced root per cup, water at ~90 °C, steep 5–10 minutes or briefly boil. Recommended in the morning/forenoon.","clinical":"Panax ginseng is one of the most studied adaptogens. For fatigue, according to a systematic review (8 RCTs), it was better than placebo on fatigue scales and in clinical effect. For blood glucose, according to a meta-analysis of 16 RCTs, it slightly reduced fasting blood glucose. Small trials also showed favorable signs for memory/mood and erectile dysfunction. Data on blood pressure are mixed.","warn":"⚠️ It may be stimulating (insomnia, restlessness) and interacts, for example, with anticoagulants and diabetes medications. In case of high blood pressure or medication use, only after consulting a doctor."},"de":{"name":"Ginseng","role":"Müdigkeit · Blutzucker","hatas":"Müdigkeit, Energie, Blutzucker, Gedächtnis (Adaptogen).","prep":"1 Teelöffel getrocknete, geschnittene Wurzel pro Tasse, Wasser mit ~90 °C, 5–10 Minuten ziehen lassen oder kurz kochen. Empfohlen morgens/vormittags.","clinical":"Panax Ginseng ist eines der am besten untersuchten Adaptogene. Bei Müdigkeit war er laut einer systematischen Übersicht (8 RCT) besser als Placebo auf den Müdigkeitsskalen und in der klinischen Wirkung. Beim Blutzucker senkte er laut einer Metaanalyse von 16 RCT den Nüchternblutzucker geringfügig. Kleine Studien zeigten auch günstige Anzeichen für Gedächtnis/Stimmung und erektile Dysfunktion. Die Daten zum Blutdruck sind uneinheitlich.","warn":"⚠️ Er kann stimulierend wirken (Schlaflosigkeit, Unruhe) und interagiert z. B. mit Blutgerinnungshemmern und Diabetesmedikamenten. Bei Bluthochdruck oder Medikamenteneinnahme nur nach Rücksprache mit dem Arzt."}},"18":{"ro":{"name":"Reishi (ceai de ciupercă)","role":"Oboseală · imunitate","hatas":"Oboseală, stare generală, imunomodulare (ciupercă adaptogenă).","prep":"Fiertură apoasă (decoct): 3–5 g de reishi uscat și feliat în ~500 ml apă, fierbere lentă 30–60 de minute. Amar – poate fi aromatizat.","clinical":"Reishi (linghzi) a fost studiat în peste 200 de studii clinice; cele mai bune date la om se referă la oboseală și starea generală de bine, cu efecte imunomodulatoare. Contrapunct IMPORTANT: un studiu RCT de calitate ridicată, de 16 săptămâni (diabet zaharat de tip 2 + sindrom metabolic), NU a găsit nicio îmbunătățire semnificativă a HbA1c, glicemiei, lipidelor sau tensiunii arteriale. Forma tradițională este un decoct apos („ceai de ciupercă”).","warn":"⚠️ Beneficiile metabolice (glicemie/colesterol) nu au fost confirmate într-un studiu de calitate ridicată. Rapoarte rare de afectare hepatică – de evitat în bolile hepatice; poate scădea tensiunea arterială și interacționează cu anticoagulantele."},"en":{"name":"Reishi (mushroom tea)","role":"Fatigue · immunity","hatas":"Fatigue, well-being, immunomodulation (adaptogenic mushroom).","prep":"Aqueous decoction: 3–5 g dried, sliced reishi simmered gently in ~500 ml water for 30–60 minutes. Bitter – can be flavored.","clinical":"Reishi (lingzhi) has been studied in more than 200 clinical trials; the best human evidence relates to fatigue and general well-being, with immunomodulatory effects. IMPORTANT counterpoint: a high-quality 16-week RCT (type 2 diabetes + metabolic syndrome) found NO meaningful improvement in HbA1c, blood glucose, lipids or blood pressure. The traditional form is a water decoction (“mushroom tea”).","warn":"⚠️ The metabolic (blood sugar/cholesterol) benefits were not confirmed in a high-quality trial. Rare reports of liver damage – avoid in liver disease; it may lower blood pressure and interacts with blood thinners."},"de":{"name":"Reishi (Pilztee)","role":"Müdigkeit · Immunsystem","hatas":"Müdigkeit, Wohlbefinden, Immunmodulation (adaptogener Pilz).","prep":"Wässrige Abkochung (Dekokt): 3–5 g getrockneten, geschnittenen Reishi in ~500 ml Wasser 30–60 Minuten langsam köcheln. Bitter – kann aromatisiert werden.","clinical":"Reishi (Glänzender Lackporling) wurde in mehr als 200 klinischen Studien untersucht; die besten Humandaten betreffen Müdigkeit und das allgemeine Wohlbefinden, mit immunmodulierenden Wirkungen. WICHTIGER Gegenpunkt: Eine hochwertige 16-wöchige RCT (Typ-2-Diabetes + metabolisches Syndrom) fand KEINE nennenswerte Verbesserung bei HbA1c, Blutzucker, Lipiden oder Blutdruck. Die traditionelle Form ist eine wässrige Abkochung („Pilztee”).","warn":"⚠️ Die metabolischen Vorteile (Blutzucker/Cholesterin) wurden in einer hochwertigen Studie nicht bestätigt. Seltene Berichte über Leberschäden – bei Lebererkrankungen zu vermeiden; kann den Blutdruck senken und wechselwirkt mit Blutverdünnern."}},"19":{"ro":{"name":"Ciuperca coama-leului","role":"Cogniție · dispoziție","hatas":"Funcție cognitivă, dispoziție, stare generală (ciupercă funcțională).","prep":"Decoct apos: 3–5 g de ciupercă uscată în ~500 ml apă, fierbere lentă 30–45 de minute. Gust blând, de fructe de mare și ciupercă.","clinical":"Ciuperca coama-leului a fost studiată în studii clinice cu eșantion mic pentru funcția cognitivă și dispoziție: rezultatele preliminare sugerează că poate îmbunătăți starea de bine, poate reduce anxietatea/iritabilitatea și, la unele persoane vârstnice cu declin cognitiv ușor, a îmbunătățit temporar scorurile cognitive. Totuși, studiile sunt mici și scurte – efectul asupra factorului de creștere a nervilor (NGF) nu a fost încă demonstrat în mod fiabil la om. Se consumă adesea sub formă de decoct apos."},"en":{"name":"Lion's mane mushroom","role":"Cognition · mood","hatas":"Cognitive function, mood, well-being (functional mushroom).","prep":"Water decoction: 3–5 g dried mushroom simmered gently in ~500 ml water for 30–45 minutes. Mild, seafood-and-mushroom flavor.","clinical":"Lion's mane mushroom has been studied in small clinical trials for cognitive function and mood: preliminary results suggest it may improve well-being, reduce anxiety/irritability, and in some older adults with mild cognitive decline it temporarily improved cognitive scores. However, the trials are small and short – the nerve growth factor (NGF) effect has not yet been reliably proven in humans. It is often consumed as a water decoction."},"de":{"name":"Löwenmähne (Pilz)","role":"Kognition · Stimmung","hatas":"Kognitive Funktion, Stimmung, Wohlbefinden (Funktionspilz).","prep":"Wässrige Abkochung: 3–5 g getrockneten Pilz in ~500 ml Wasser 30–45 Minuten langsam köcheln. Milder, an Meeresfrüchte und Pilz erinnernder Geschmack.","clinical":"Der Löwenmähne-Pilz wurde in klinischen Studien mit kleiner Stichprobe hinsichtlich kognitiver Funktion und Stimmung untersucht: Vorläufige Ergebnisse deuten darauf hin, dass er das Wohlbefinden verbessern, Angst/Reizbarkeit verringern und bei einigen älteren Menschen mit leichtem kognitivem Abbau die kognitiven Werte vorübergehend verbessern kann. Die Studien sind jedoch klein und kurz – die Wirkung auf den Nervenwachstumsfaktor (NGF) ist beim Menschen noch nicht zuverlässig nachgewiesen. Er wird häufig als wässrige Abkochung konsumiert."}},"20":{"ro":{"name":"Curcuma","role":"Articulații · inflamație","hatas":"Durere articulară (artroză), reducerea inflamației, digestie.","prep":"1 linguriță de pudră de curcuma sau câteva felii de rădăcină proaspătă / ceașcă, ~100 °C, 10 minute. Un praf de PIPER NEGRU (piperină) și puțină grăsime (de ex. lapte) cresc de mai multe ori absorbția.","clinical":"Substanța activă din curcuma este curcumina. Conform unei metaanalize a 16 studii RCT (1810 adulți), extractul de curcuma (aproximativ 1000 mg curcumină pe zi) a fost la fel de eficient în durerea din artroza genunchiului ca antiinflamatoarele nesteroidiene (AINS), cu mai puține efecte adverse gastrointestinale. O analiză mai amplă, cu 29 de studii RCT (2396 de persoane), a găsit reducerea simptomelor și a inflamației în mai multe boli articulare. IMPORTANT: absorbția curcuminei este slabă – de aceea se folosesc piper negru/grăsime sau extracte speciale; cantitatea absorbită din ceai este mai mică decât cea din capsulele folosite în studii.","warn":"⚠️ Extractul de curcumină în doze mari poate cauza rar probleme hepatice și interacționează cu anticoagulantele. Prudență în caz de calculi biliari/obstrucție a căilor biliare."},"en":{"name":"Turmeric","role":"Joints · inflammation","hatas":"Joint (osteoarthritis) pain, anti-inflammatory action, digestion.","prep":"1 tsp turmeric powder or a few slices of fresh root / cup, ~100 °C, 10 minutes. A pinch of BLACK PEPPER (piperine) and a little fat (e.g. milk) increase absorption several-fold.","clinical":"The active compound in turmeric is curcumin. According to a meta-analysis of 16 RCTs (1810 adults), turmeric extract (about 1000 mg curcumin daily) was similarly effective for knee osteoarthritis pain as non-steroidal anti-inflammatory drugs (NSAIDs), with fewer gastrointestinal side effects. A larger review of 29 RCTs (2396 people) also found symptom and inflammation reduction in several joint diseases. IMPORTANT: curcumin absorption is poor – this is why black pepper/fat or special extracts are used; the amount absorbed from tea is smaller than from the capsules used in trials.","warn":"⚠️ High-dose curcumin extract can, in rare cases, cause liver problems and interacts with blood thinners. Use caution in case of gallstones/bile duct obstruction."},"de":{"name":"Kurkuma","role":"Gelenke · Entzündung","hatas":"Gelenkschmerzen (Arthrose), Entzündungshemmung, Verdauung.","prep":"1 TL Kurkumapulver oder ein paar Scheiben frische Wurzel / Tasse, ~100 °C, 10 Minuten. Eine Prise SCHWARZER PFEFFER (Piperin) und etwas Fett (z. B. Milch) erhöhen die Aufnahme um ein Vielfaches.","clinical":"Der Wirkstoff der Kurkuma ist Curcumin. Laut einer Metaanalyse von 16 RCTs (1810 Erwachsene) war Kurkuma-Extrakt (etwa 1000 mg Curcumin täglich) bei Knie-Arthrose-Schmerzen ähnlich wirksam wie nichtsteroidale Entzündungshemmer (NSAR), mit weniger Magen-Darm-Nebenwirkungen. Eine größere Übersichtsarbeit mit 29 RCTs (2396 Personen) fand ebenfalls eine Verringerung von Symptomen und Entzündung bei mehreren Gelenkerkrankungen. WICHTIG: Die Aufnahme von Curcumin ist schlecht – deshalb werden schwarzer Pfeffer/Fett oder spezielle Extrakte verwendet; die aus dem Tee aufgenommene Menge ist geringer als die der in Studien verwendeten Kapseln.","warn":"⚠️ Hochdosierter Curcumin-Extrakt kann in seltenen Fällen Leberprobleme verursachen und wechselwirkt mit Blutverdünnern. Bei Gallensteinen/Gallengangsverschluss vorsichtig sein."}},"21":{"ro":{"name":"Ghimbir","role":"Greață · digestie","hatas":"Greață, digestie, durere menstruală, inflamație.","prep":"3–4 felii subțiri de ghimbir proaspăt (sau ½ linguriță de pudră) / ceașcă, ~100 °C, 8–10 minute, acoperit. Poate fi aromatizat cu lămâie și miere.","clinical":"Ghimbirul este una dintre cele mai bine dovedite plante împotriva greței. Conform unei metaanalize a 12 studii RCT (1278 de gravide), a redus semnificativ greața de sarcină comparativ cu placebo. A redus simptomele și în greața indusă de chimioterapie (de ex., într-un studiu cu 576 de persoane, ~0,5–1 g pe zi). În durerea menstruală primară (dismenoree), mai multe studii RCT l-au găsit mai eficient decât placebo, iar în unele studii comparabil cu ibuprofenul. Stimulează, de asemenea, digestia și motilitatea gastrointestinală.","warn":"⚠️ În sarcină se recomandă în general cel mult ~1 g/zi; în caz de anticoagulante sau calculi biliari, doar după consultarea medicului."},"en":{"name":"Ginger","role":"Nausea · digestion","hatas":"Nausea, digestion, menstrual pain, inflammation.","prep":"3–4 thin slices of fresh ginger (or ½ tsp powder) / cup, ~100 °C, 8–10 minutes, covered. Can be flavored with lemon and honey.","clinical":"Ginger is one of the best-proven anti-nausea plants. According to a meta-analysis of 12 RCTs (1278 pregnant women), it significantly reduced pregnancy nausea compared to placebo. It also reduced symptoms in chemotherapy-induced nausea (e.g. in a 576-person trial, ~0.5–1 g daily). For primary menstrual pain (dysmenorrhea), several RCTs found it more effective than placebo and, in some trials, comparable to ibuprofen. It also enhances digestion and gastrointestinal motility.","warn":"⚠️ In pregnancy, generally no more than ~1 g/day is recommended; in case of blood thinners or gallstones, consult a doctor."},"de":{"name":"Ingwer","role":"Übelkeit · Verdauung","hatas":"Übelkeit, Verdauung, Menstruationsschmerzen, Entzündung.","prep":"3–4 dünne Scheiben frischer Ingwer (oder ½ TL Pulver) / Tasse, ~100 °C, 8–10 Minuten, abgedeckt. Kann mit Zitrone und Honig aromatisiert werden.","clinical":"Ingwer ist eine der am besten belegten Pflanzen gegen Übelkeit. Laut einer Metaanalyse von 12 RCTs (1278 Schwangere) reduzierte er die Schwangerschaftsübelkeit im Vergleich zu Placebo signifikant. Auch bei chemotherapiebedingter Übelkeit verringerte er die Symptome (z. B. in einer Studie mit 576 Personen ~0,5–1 g täglich). Bei primären Menstruationsschmerzen (Dysmenorrhoe) war er laut mehreren RCTs wirksamer als Placebo und in einigen Studien mit Ibuprofen vergleichbar. Er fördert außerdem die Verdauung und die Magen-Darm-Motilität.","warn":"⚠️ In der Schwangerschaft werden in der Regel höchstens ~1 g/Tag empfohlen; bei Blutverdünnern oder Gallensteinen nur nach Rücksprache mit dem Arzt."}},"22":{"ro":{"name":"Lămâie","role":"Vitamina C · aromatizant","hatas":"Vitamina C, antioxidant, aromatizant; efect ușor asupra tensiunii arteriale.","prep":"Sucul/o felie de la ½ lămâie în apă fierbinte (nu clocotită, ~60–70 °C) – apa prea fierbinte reduce vitamina C. Frecvent cu miere și ghimbir. Apa caldă cu lămâie dimineața este populară.","clinical":"Dovezile clinice solide de sine stătătoare pentru lămâie sunt limitate – există mai ales studii mici. Într-un studiu japonez (101 femei de vârstă mijlocie), consumul zilnic de lămâie + mersul pe jos a fost asociat cu o tensiune arterială sistolică mai mică. În studii clinice mici, sucul de lămâie a scăzut ușor tensiunea arterială (prin polifenoli/flavonoide – de ex. hesperidina – și vitamina C). Lămâia este remarcabil de bogată în vitamina C și flavonoide, dar lipsesc studiile RCT ample și de calitate ridicată – efectul de sine stătător este mai degrabă de natură complementară/aromatizantă."},"en":{"name":"Lemon","role":"Vitamin C · flavoring","hatas":"Vitamin C, antioxidant, flavoring; mild blood pressure effect.","prep":"Juice/slice of ½ lemon in hot (not boiling, ~60–70 °C) water – water that is too hot reduces vitamin C. Often with honey and ginger. Warm lemon water in the morning is popular.","clinical":"Strong standalone clinical evidence for lemon is limited – mainly small studies exist. In a Japanese study (101 middle-aged women), daily lemon consumption + walking was associated with lower systolic blood pressure. In small clinical trials, lemon juice slightly lowered blood pressure (via the polyphenols/flavonoids – e.g. hesperidin – and vitamin C). Lemon is exceptionally rich in vitamin C and flavonoids, but large, high-quality RCTs are lacking – its standalone effect is more of a complementary/flavoring nature."},"de":{"name":"Zitrone","role":"Vitamin C · Aroma","hatas":"Vitamin C, Antioxidans, Aromagebung; milde Blutdruckwirkung.","prep":"Saft/Scheibe einer ½ Zitrone in heißes (nicht kochendes, ~60–70 °C) Wasser – zu heißes Wasser verringert das Vitamin C. Häufig mit Honig und Ingwer. Warmes Zitronenwasser am Morgen ist beliebt.","clinical":"Starke eigenständige klinische Belege für die Zitrone sind begrenzt – es gibt vor allem kleine Studien. In einer japanischen Studie (101 Frauen mittleren Alters) war der tägliche Zitronenkonsum + Gehen mit einem niedrigeren systolischen Blutdruck verbunden. In kleinen klinischen Studien senkte Zitronensaft den Blutdruck leicht (über die Polyphenole/Flavonoide – z. B. Hesperidin – und Vitamin C). Die Zitrone ist außergewöhnlich reich an Vitamin C und Flavonoiden, aber große, hochwertige RCTs fehlen – die eigenständige Wirkung ist eher ergänzender/geschmacklicher Natur."}},"23":{"ro":{"name":"Mentă creață","role":"PCOS · androgeni","hatas":"PCOS/androgeni, hirsutism, digestie.","prep":"1–2 lingurițe de mentă creață uscată / ceașcă, ~100 °C, 5–7 minute, acoperit. În PCOS, în studii, 2 cești pe zi.","clinical":"Efectul de scădere a androgenilor al mentei crețe (NU al mentei piperate!) a fost confirmat de mai multe studii randomizate în PCOS. Într-un studiu RCT de 30 de zile (42 de femei), 2 cești de ceai de mentă creață pe zi au redus semnificativ testosteronul liber comparativ cu placebo. Într-un studiu din 2024, de 12 săptămâni, cu 150 de persoane, cel mai mare efect s-a dezvoltat până în săptămâna a 12-a. Nivelul hormonal se modifică rapid, dar îmbunătățirea vizibilă a creșterii părului necesită mai mult timp (firele de păr se înlocuiesc lent). Efectul este real, dar mai blând decât cel al antiandrogenilor farmaceutici (de ex. spironolactonă)."},"en":{"name":"Spearmint","role":"PCOS · androgens","hatas":"PCOS/androgens, hirsutism, digestion.","prep":"1–2 tsp dried spearmint / cup, ~100 °C, 5–7 minutes, covered. For PCOS, the trials used 2 cups daily.","clinical":"The androgen-lowering effect of spearmint (NOT peppermint!) has been confirmed by several randomized trials in PCOS. In a 30-day RCT (42 women), 2 cups of spearmint tea daily significantly reduced free testosterone compared to placebo. In a 2024 12-week, 150-person study, the greatest effect developed by week 12. Hormone levels change quickly, but visible improvement in hair growth takes longer (hairs are replaced slowly). The effect is real but milder than that of pharmaceutical antiandrogens (e.g. spironolactone)."},"de":{"name":"Grüne Minze","role":"PCOS · Androgene","hatas":"PCOS/Androgene, Hirsutismus, Verdauung.","prep":"1–2 TL getrocknete Grüne Minze / Tasse, ~100 °C, 5–7 Minuten, abgedeckt. Bei PCOS wurden in den Studien 2 Tassen täglich verwendet.","clinical":"Die androgensenkende Wirkung der Grünen Minze (NICHT der Pfefferminze!) wurde durch mehrere randomisierte Studien bei PCOS bestätigt. In einer 30-tägigen RCT (42 Frauen) senkten 2 Tassen Grüne-Minze-Tee täglich das freie Testosteron im Vergleich zu Placebo signifikant. In einer 12-wöchigen Studie aus dem Jahr 2024 mit 150 Personen entwickelte sich die größte Wirkung bis zur 12. Woche. Der Hormonspiegel ändert sich schnell, aber eine sichtbare Verbesserung des Haarwuchses braucht länger (die Haare werden langsam ersetzt). Die Wirkung ist real, aber milder als die von pharmazeutischen Antiandrogenen (z. B. Spironolacton)."}},"24":{"ro":{"name":"Scorțișoară","role":"Glicemie · lipide","hatas":"Glicemie, colesterol, durere menstruală.","prep":"½–1 linguriță de scorțișoară măcinată sau 1 baton de scorțișoară / ceașcă, ~100 °C, 10 minute. Simplă sau amestecată cu alt ceai. Pentru cantități mai mari se recomandă scorțișoara de Ceylon.","clinical":"Conform mai multor metaanalize RCT, scorțișoara poate scădea glicemia à jeun și poate îmbunătăți profilul lipidic, mai ales la diabetici/în sindromul metabolic. Într-o analiză a 10 studii RCT (543 de persoane), glicemia à jeun a scăzut cu aproximativ −24 mg/dl, iar colesterolul și trigliceridele s-au redus, de asemenea; efectul este mai pronunțat la doze mai mari (\u003e1,5 g/zi). A redus și intensitatea și durata durerii menstruale primare.","warn":"⚠️ Scorțișoara cassia (din comerț) conține multă cumarină – în cantități mari și regulate poate suprasolicita ficatul. Pentru acest scop, scorțișoara de Ceylon este mai sigură."},"en":{"name":"Cinnamon","role":"Blood sugar · lipids","hatas":"Blood sugar, cholesterol, menstrual pain.","prep":"½–1 tsp ground cinnamon or 1 cinnamon stick / cup, ~100 °C, 10 minutes. On its own or mixed into another tea. For larger amounts, Ceylon cinnamon is recommended.","clinical":"According to several RCT meta-analyses, cinnamon can lower fasting blood glucose and improve the lipid profile, especially in diabetics/metabolic syndrome. In an analysis of 10 RCTs (543 people), fasting blood glucose decreased by about −24 mg/dl, and cholesterol and triglycerides also declined; the effect is more pronounced at higher doses (\u003e1.5 g/day). It also reduced the intensity and duration of primary menstrual pain.","warn":"⚠️ Cassia (store-bought) cinnamon contains a lot of coumarin – in large, regular amounts it can burden the liver. For this purpose, Ceylon cinnamon is safer."},"de":{"name":"Zimt","role":"Blutzucker · Lipide","hatas":"Blutzucker, Cholesterin, Menstruationsschmerzen.","prep":"½–1 TL gemahlener Zimt oder 1 Zimtstange / Tasse, ~100 °C, 10 Minuten. Pur oder in einen anderen Tee gemischt. Für größere Mengen wird Ceylon-Zimt empfohlen.","clinical":"Laut mehreren RCT-Metaanalysen kann Zimt den Nüchternblutzucker senken und das Lipidprofil verbessern, vor allem bei Diabetikern/metabolischem Syndrom. In einer Analyse von 10 RCTs (543 Personen) sank der Nüchternblutzucker um etwa −24 mg/dl, und auch Cholesterin sowie Triglyceride verringerten sich; die Wirkung ist bei höherer Dosis (\u003e1,5 g/Tag) ausgeprägter. Auch bei primären Menstruationsschmerzen verringerte er Stärke und Dauer der Schmerzen.","warn":"⚠️ Cassia-Zimt (aus dem Handel) enthält viel Cumarin – in großen, regelmäßigen Mengen kann er die Leber belasten. Für diesen Zweck ist Ceylon-Zimt sicherer."}},"25":{"ro":{"name":"Fenicul","role":"Crampe · menstruație","hatas":"Balonare, crampe, durere menstruală, colici la sugari.","prep":"1 linguriță de semințe de fenicul proaspăt zdrobite / ceașcă, ~100 °C, 10–15 minute, acoperit.","clinical":"Feniculul este folosit datorită efectului său antispastic și de susținere a digestiei. În studii randomizate a redus durerea menstruală primară (dismenoree) comparativ cu placebo, iar într-un studiu controlat cu placebo a ameliorat și simptomele colicilor la sugari. Efectul său antispastic asupra contracțiilor uterine și a crampelor intestinale a fost confirmat și în laborator. Studiile au eșantioane mici – sunt necesare studii mai ample, de confirmare."},"en":{"name":"Fennel","role":"Cramps · menstruation","hatas":"Bloating, cramps, menstrual pain, infant colic.","prep":"1 tsp freshly crushed fennel seeds / cup, ~100 °C, 10–15 minutes, covered.","clinical":"Fennel is used for its antispasmodic and digestion-supporting effects. In randomized trials it reduced primary menstrual pain (dysmenorrhea) compared to placebo, and in a placebo-controlled trial it also relieved the symptoms of infant colic. Its antispasmodic effect on uterine contractions and intestinal cramps has also been confirmed in the laboratory. The trials are small – larger, confirmatory studies are needed."},"de":{"name":"Fenchel","role":"Krämpfe · Menstruation","hatas":"Blähungen, Krämpfe, Menstruationsschmerzen, Säuglingskoliken.","prep":"1 TL frisch zerstoßene Fenchelsamen / Tasse, ~100 °C, 10–15 Minuten, abgedeckt.","clinical":"Fenchel wird wegen seiner krampflösenden und verdauungsfördernden Wirkung verwendet. In randomisierten Studien verringerte er primäre Menstruationsschmerzen (Dysmenorrhoe) im Vergleich zu Placebo, und in einer placebokontrollierten Studie linderte er auch die Symptome von Säuglingskoliken. Seine krampflösende Wirkung auf Gebärmutterkontraktionen und Darmkrämpfe wurde auch im Labor bestätigt. Die Studien haben kleine Stichproben – größere, bestätigende Studien sind erforderlich."}},"26":{"ro":{"name":"Păducel","role":"Inimă · circulație","hatas":"Insuficiență cardiacă ușoară, circulație, tensiune arterială.","prep":"1–2 lingurițe de păducel uscat (flori + frunze sau fructe) / cană, ~100 °C, 10–15 minute acoperit. Din fructe se poate prepara și un decoct.","clinical":"Extractul de păducel este una dintre cele mai bine studiate plante pentru inimă. Conform unei analize Cochrane (14 studii RCT dublu-orb, controlate cu placebo), adăugat PE LÂNGĂ tratamentul standard, a ameliorat simptomele insuficienței cardiace cronice și capacitatea de efort a inimii (de ex. toleranța la efort, simptomele). Analizele raportează și un efect ușor de scădere a tensiunii arteriale și a lipidelor.","warn":"⚠️ La persoanele care iau medicamente pentru inimă (de ex. digoxină) sau hipotensoare, interacționează – numai după consultarea medicului. Ceaiul NU înlocuiește tratamentul bolilor cardiace grave. Contrafacerile mexicane vândute sub numele de „tejocote” pot fi periculoase."},"en":{"name":"Hawthorn","role":"Heart · circulation","hatas":"Mild heart failure, circulation, blood pressure.","prep":"1–2 tsp dried hawthorn (flowers + leaves or berries) / cup, ~100 °C, 10–15 minutes covered. A decoction can also be made from the berries.","clinical":"Hawthorn extract is one of the best-studied heart herbs. According to a Cochrane review (14 double-blind, placebo-controlled RCTs), added ON TOP OF standard treatment it improved the symptoms of chronic heart failure and the heart's exercise capacity (e.g. exercise tolerance, symptoms). Reviews also report a mild blood-pressure- and lipid-lowering effect.","warn":"⚠️ It interacts in people taking heart medication (e.g. digoxin) or blood-pressure-lowering drugs – only after consulting a doctor. The tea does NOT replace treatment of serious heart disease. Mexican counterfeits sold as “tejocote” can be dangerous."},"de":{"name":"Weißdorn","role":"Herz · Kreislauf","hatas":"Leichte Herzinsuffizienz, Kreislauf, Blutdruck.","prep":"1–2 TL getrockneter Weißdorn (Blüten + Blätter oder Beeren) / Tasse, ~100 °C, 10–15 Minuten abgedeckt. Aus den Beeren kann auch ein Dekokt zubereitet werden.","clinical":"Weißdornextrakt ist eine der am besten untersuchten Herzpflanzen. Laut einer Cochrane-Übersichtsarbeit (14 doppelblinde, placebokontrollierte RCTs) verbesserte er ZUSÄTZLICH zur Standardbehandlung die Symptome der chronischen Herzinsuffizienz und die Belastbarkeit des Herzens (z. B. Belastungstoleranz, Symptome). Übersichtsarbeiten berichten auch über eine leicht blutdruck- und lipidsenkende Wirkung.","warn":"⚠️ Bei Personen, die Herzmedikamente (z. B. Digoxin) oder Blutdrucksenker einnehmen, kommt es zu Wechselwirkungen – nur nach Rücksprache mit dem Arzt. Der Tee ersetzt NICHT die Behandlung schwerer Herzerkrankungen. Als „Tejocote” verkaufte mexikanische Fälschungen können gefährlich sein."}},"27":{"ro":{"name":"Ghimbir-lămâie-miere","role":"Rețetă · răceală","hatas":"Răceală, durere în gât, tuse, greață, vitamina C.","prep":"Ingrediente (1 cană mare): 3–4 felii subțiri de ghimbir proaspăt · zeama de ½ lămâie · 1–2 lingurițe de miere · ~300 ml apă.\n\n1. Fierbe apa cu ghimbirul și fierbe la foc mic 8–10 minute, acoperit.\n2. Ia de pe foc și lasă să se răcească puțin (la ~60–70 °C).\n3. Adaugă zeama de lămâie și mierea numai în ceaiul călduț (apa clocotită reduce valoarea mierii și a vitaminei C).\n4. După gust, poți adăuga și un vârf de scorțișoară sau curcuma.","clinical":"Elementele rețetei au fost studiate și separat. Ghimbirul a redus greața în mai multe metaanalize (sarcină, chimioterapie). La tusea nocturnă a copiilor, mierea, în studii randomizate, a ameliorat tusea și a îmbunătățit somnul mai bine decât lipsa tratamentului/placebo – de aceea este recomandată și de mai multe ghiduri (peste 1 an). Lămâia este o sursă de vitamina C și flavonoide, iar lichidul cald, în sine, ameliorează durerea în gât și congestia nazală. IMPORTANT: aceasta este o ameliorare simptomatică, nu vindecă infecția.","warn":"⚠️ Nu da NICIODATĂ miere sugarilor sub 1 an (risc de botulism). Diabeticii trebuie să fie atenți la cantitatea de miere."},"en":{"name":"Ginger-lemon-honey","role":"Recipe · cold","hatas":"Cold, sore throat, cough, nausea, vitamin C.","prep":"Ingredients (1 large mug): 3–4 thin slices of fresh ginger · juice of ½ lemon · 1–2 tsp honey · ~300 ml water.\n\n1. Bring the water to a boil with the ginger and simmer over low heat for 8–10 minutes, covered.\n2. Take it off the heat and let it cool slightly (to ~60–70 °C).\n3. Stir the lemon juice and honey only into the lukewarm tea (boiling water reduces the value of the honey and vitamin C).\n4. To taste, a pinch of cinnamon or turmeric can also be added.","clinical":"The components of the recipe have also been studied individually. In several meta-analyses ginger reduced nausea (pregnancy, chemotherapy). For children's nighttime cough, in randomized trials honey relieved the cough and improved sleep better than no treatment/placebo – which is why several guidelines recommend it (over 1 year of age). Lemon is a source of vitamin C and flavonoids, and warm liquid itself relieves sore throat and nasal congestion. IMPORTANT: this is symptomatic relief, it does not cure the infection.","warn":"⚠️ NEVER give honey to infants under 1 year of age (risk of botulism). Diabetics need to watch the amount of honey."},"de":{"name":"Ingwer-Zitrone-Honig","role":"Rezept · Erkältung","hatas":"Erkältung, Halsschmerzen, Husten, Übelkeit, Vitamin C.","prep":"Zutaten (1 große Tasse): 3–4 dünne Scheiben frischer Ingwer · Saft von ½ Zitrone · 1–2 TL Honig · ~300 ml Wasser.\n\n1. Das Wasser mit dem Ingwer aufkochen und bei schwacher Hitze 8–10 Minuten abgedeckt köcheln lassen.\n2. Vom Herd nehmen und etwas abkühlen lassen (auf ~60–70 °C).\n3. Zitronensaft und Honig erst in den lauwarmen Tee einrühren (kochendes Wasser mindert den Wert von Honig und Vitamin C).\n4. Nach Geschmack kann auch eine Prise Zimt oder Kurkuma hinzugefügt werden.","clinical":"Die Bestandteile des Rezepts wurden auch einzeln untersucht. Ingwer reduzierte in mehreren Metaanalysen die Übelkeit (Schwangerschaft, Chemotherapie). Bei nächtlichem Husten von Kindern linderte Honig in randomisierten Studien den Husten besser als keine Behandlung/Placebo und verbesserte den Schlaf – deshalb wird er auch von mehreren Leitlinien empfohlen (ab 1 Jahr). Die Zitrone ist eine Quelle für Vitamin C und Flavonoide, und die warme Flüssigkeit selbst lindert Halsschmerzen und verstopfte Nase. WICHTIG: Dies ist eine symptomatische Linderung, sie heilt die Infektion nicht.","warn":"⚠️ Säuglingen unter 1 Jahr NIEMALS Honig geben (Botulismusgefahr). Diabetiker müssen auf die Honigmenge achten."}},"28":{"ro":{"name":"Valeriană","role":"Somn · calmare","hatas":"Adormire, calitatea somnului, calmare.","prep":"1 linguriță de rădăcină uscată și mărunțită / cană, ~90–100 °C, 10 minute acoperit. Cu ~30–60 de minute înainte de culcare. Gustul/mirosul este puternic, caracteristic.","clinical":"Valeriana este folosită în mod tradițional ca somnifer. Conform unei analize sistematice care a cuprins 16 studii RCT (1093 de pacienți), valeriana a îmbunătățit calitatea somnului (șansa de ameliorare este de aproximativ 1,8 ori mai mare comparativ cu placebo), dar studiile au fost slabe din punct de vedere metodologic și a apărut și posibilitatea unei distorsiuni de publicare. Analizele mai recente sunt mixte: adesea arată o ameliorare subiectivă (percepută) a somnului, dar mai puțin la măsurătorile obiective cu aparate. În general este sigură, bine tolerată; se combină adesea cu roiniță/hamei."},"en":{"name":"Valerian","role":"Sleep · calming","hatas":"Falling asleep, sleep quality, calming.","prep":"1 tsp dried, chopped root / cup, ~90–100 °C, 10 minutes covered. About 30–60 minutes before bedtime. Its taste/smell is strong and distinctive.","clinical":"Valerian is traditionally used as a sleep aid. According to a systematic review covering 16 RCTs (1093 patients), valerian improved sleep quality (the odds of improvement are about 1.8 times higher compared to placebo), but the studies were methodologically weak and publication bias was also a concern. More recent reviews are mixed: it often shows subjective (perceived) sleep improvement, but less so with objective instrumental measurement. It is generally safe and well tolerated; it is often combined with lemon balm/hops."},"de":{"name":"Baldrian","role":"Schlaf · Beruhigung","hatas":"Einschlafen, Schlafqualität, Beruhigung.","prep":"1 TL getrocknete, zerkleinerte Wurzel / Tasse, ~90–100 °C, 10 Minuten abgedeckt. Etwa 30–60 Minuten vor dem Schlafengehen. Geschmack/Geruch sind stark und charakteristisch.","clinical":"Baldrian wird traditionell als Schlafmittel verwendet. Laut einer systematischen Übersichtsarbeit mit 16 RCTs (1093 Patienten) verbesserte Baldrian die Schlafqualität (die Chance auf Besserung ist im Vergleich zu Placebo etwa 1,8-mal höher), doch die Studien waren methodisch schwach und es bestand auch der Verdacht auf einen Publikationsbias. Neuere Übersichtsarbeiten sind uneinheitlich: Eine subjektive (empfundene) Schlafverbesserung zeigt sich häufig, mit objektiver apparativer Messung weniger. Im Allgemeinen ist er sicher und gut verträglich; er wird oft mit Melisse/Hopfen kombiniert."}},"29":{"ro":{"name":"Floarea-pasiunii (passiflora)","role":"Anxietate · somn","hatas":"Anxietate, adormire, neliniște.","prep":"1 linguriță de floarea-pasiunii uscată / cană, ~100 °C, 8–10 minute acoperit. Recomandat seara.","clinical":"Flavonoidele florii-pasiunii (passiflora) acționează asupra sistemului GABA. Într-un mic studiu RCT dublu-orb (41 de persoane), ceaiul de passiflora a îmbunătățit calitatea somnului într-o săptămână comparativ cu placebo (în medie cu aproximativ 20 de minute mai mult somn). Pentru anxietate, analizele privind plantele o încadrează printre cele mai bine studiate, cu o reducere modestă a anxietății, mai mare decât la placebo. Studiile sunt mici – sunt necesare studii mai mari, pe termen lung."},"en":{"name":"Passionflower (passiflora)","role":"Anxiety · sleep","hatas":"Anxiety, falling asleep, restlessness.","prep":"1 tsp dried passionflower / cup, ~100 °C, 8–10 minutes covered. Recommended in the evening.","clinical":"The flavonoids of passionflower (passiflora) act on the GABA system. In a small, double-blind RCT (41 people), passionflower tea improved sleep quality over one week compared to placebo (on average about 20 minutes more sleep). For anxiety, herbal reviews rank it among the better-studied ones, with a modest anxiety reduction that is greater than placebo. The studies are small – larger, long-term studies are needed."},"de":{"name":"Passionsblume (Passiflora)","role":"Angst · Schlaf","hatas":"Angst, Einschlafen, Unruhe.","prep":"1 TL getrocknete Passionsblume / Tasse, ~100 °C, 8–10 Minuten abgedeckt. Abends empfohlen.","clinical":"Die Flavonoide der Passionsblume (Passiflora) wirken auf das GABA-System. In einer kleinen, doppelblinden RCT (41 Personen) verbesserte Passionsblumentee innerhalb einer Woche die Schlafqualität im Vergleich zu Placebo (durchschnittlich etwa 20 Minuten mehr Schlaf). Bei Angst zählen herbale Übersichtsarbeiten sie zu den besser untersuchten, mit einer moderaten, placeboüberlegenen Angstreduktion. Die Studien sind klein – größere, langfristige Studien sind erforderlich."}},"30":{"ro":{"name":"Lavandă","role":"Anxietate · calmare","hatas":"Anxietate, neliniște, somn, dispoziție.","prep":"1–2 lingurițe de flori de lavandă uscate / cană, ~100 °C, 5–8 minute acoperit. Este suficientă și o cantitate mică – aroma este puternică.","clinical":"Cele mai puternice dovezi există pentru un preparat standardizat de ulei de lavandă administrat ORAL (Silexan). În studii randomizate și metaanalize, Silexan a redus semnificativ anxietatea comparativ cu placebo (scala de anxietate Hamilton), în anxietatea generalizată a fost comparabil cu lorazepamul/paroxetina, fără dependență; s-a dovedit eficient și în depresia ușoară–moderată. IMPORTANT: acest lucru este valabil pentru uleiul în capsule – efectul ceaiului de lavandă este mai ușor, în principal în scop calmant/de ajutor pentru somn.","warn":"⚠️ Majoritatea studiilor Silexan au fost efectuate de producător. Efectul ceaiului de lavandă este mai slab decât cel al capsulei standardizate."},"en":{"name":"Lavender","role":"Anxiety · calming","hatas":"Anxiety, restlessness, sleep, mood.","prep":"1–2 tsp dried lavender flowers / cup, ~100 °C, 5–8 minutes covered. A small amount is enough – the aroma is strong.","clinical":"The strongest evidence exists for a standardized, ORALLY taken lavender oil preparation (Silexan). In randomized trials and meta-analyses, Silexan significantly reduced anxiety compared to placebo (Hamilton Anxiety Scale); in generalized anxiety it was comparable to lorazepam/paroxetine, without dependence; it also proved effective in mild-to-moderate depression. IMPORTANT: this applies to the capsule oil – the effect of lavender tea is milder, primarily for calming/sleep-aiding purposes.","warn":"⚠️ Most of the Silexan studies were carried out by the manufacturer. The effect of lavender tea is weaker than that of the standardized capsule."},"de":{"name":"Lavendel","role":"Angst · Beruhigung","hatas":"Angst, Unruhe, Schlaf, Stimmung.","prep":"1–2 TL getrocknete Lavendelblüten / Tasse, ~100 °C, 5–8 Minuten abgedeckt. Eine kleine Menge genügt – das Aroma ist stark.","clinical":"Die stärkste Evidenz besteht für ein standardisiertes, ORAL eingenommenes Lavendelöl-Präparat (Silexan). In randomisierten Studien und Metaanalysen reduzierte Silexan die Angst signifikant im Vergleich zu Placebo (Hamilton-Angstskala); bei generalisierter Angst war es mit Lorazepam/Paroxetin vergleichbar, ohne Abhängigkeit; auch bei leichter bis mittelschwerer Depression erwies es sich als wirksam. WICHTIG: Dies gilt für das Kapselöl – die Wirkung von Lavendeltee ist milder, vor allem zu beruhigenden/schlaffördernden Zwecken.","warn":"⚠️ Die meisten Silexan-Studien wurden vom Hersteller durchgeführt. Die Wirkung von Lavendeltee ist schwächer als die der standardisierten Kapsel."}},"31":{"ro":{"name":"Cătină","role":"Vitamina C · piele","hatas":"Vitamina C, antioxidant, piele, mucoase.","prep":"1–2 lingurițe de fructe de cătină uscate / cană, ~90 °C, 10 minute; se poate amesteca și cu suc proaspăt stors. Foarte acrișor, bogat în vitamina C.","clinical":"Cătina este excepțional de bogată în vitamina C, carotenoizi, flavonoide și acizi grași omega. În studii clinice mici a arătat semne favorabile asupra hidratării/vindecării pielii, uscăciunii ochilor și asupra unor indicatori metabolici, iar în prezent se desfășoară și studii (de ex. digestie/constipație). Dovezile sunt deocamdată limitate și pe eșantioane mici – lipsesc studii mari, de bună calitate, asupra ceaiului; valoarea sa principală este conținutul ridicat de nutrienți."},"en":{"name":"Sea buckthorn","role":"Vitamin C · skin","hatas":"Vitamin C, antioxidant, skin, mucous membranes.","prep":"1–2 tsp dried sea buckthorn berries / cup, ~90 °C, 10 minutes; can also be mixed with freshly pressed juice. Very tart, rich in vitamin C.","clinical":"Sea buckthorn is exceptionally rich in vitamin C, carotenoids, flavonoids and omega fatty acids. In small clinical trials it showed favorable signs for skin hydration/healing, dry eye and certain metabolic markers, and studies are currently ongoing (e.g. digestion/constipation). The evidence is so far limited and based on small samples – large, high-quality tea studies are lacking; its main value is the high nutrient content."},"de":{"name":"Sanddorn","role":"Vitamin C · Haut","hatas":"Vitamin C, Antioxidans, Haut, Schleimhäute.","prep":"1–2 TL getrocknete Sanddornbeeren / Tasse, ~90 °C, 10 Minuten; kann auch mit frisch gepresstem Saft gemischt werden. Sehr säuerlich, reich an Vitamin C.","clinical":"Sanddorn ist außergewöhnlich reich an Vitamin C, Carotinoiden, Flavonoiden und Omega-Fettsäuren. In kleinen klinischen Studien zeigte er günstige Anzeichen für die Hautfeuchtigkeit/-heilung, trockene Augen und einige Stoffwechselmarker, und derzeit laufen weitere Studien (z. B. Verdauung/Verstopfung). Die Evidenz ist bislang begrenzt und beruht auf kleinen Stichproben – große, hochwertige Teestudien fehlen; sein Hauptwert ist der hohe Nährstoffgehalt."}},"32":{"ro":{"name":"Urzică","role":"Prostată · articulații","hatas":"Simptome de prostată (HBP), articulații, alergie, diureză.","prep":"1–2 lingurițe de frunze de urzică uscate / cană, ~100 °C, 10 minute acoperit. (În HBP, studiile au folosit mai degrabă extractul de rădăcină.)","clinical":"Urzica (rădăcina) în hipertrofia benignă de prostată (HBP), în mai multe studii randomizate, a redus simptomele urinare (scorul IPSS), adesea administrată pe lângă tratamentul convențional. Frunza de urzică a arătat semne favorabile în rinita alergică și – în studii mici – asupra glicemiei, iar în afecțiunile articulare este folosită în mod tradițional. Dovezile sunt mixte și multe studii au eșantioane mici; efectul ceaiului din frunze este mai ușor decât cel al extractului concentrat de rădăcină."},"en":{"name":"Nettle","role":"Prostate · joints","hatas":"Prostate (BPH) symptoms, joints, allergy, diuresis.","prep":"1–2 tsp dried nettle leaves / cup, ~100 °C, 10 minutes covered. (For BPH, the studies rather used the root extract.)","clinical":"Nettle (root) in benign prostatic hyperplasia (BPH) reduced urinary symptoms (IPSS score) in several randomized trials, often given alongside conventional treatment. Nettle leaf showed favorable signs in allergic rhinitis and – in small studies – on blood sugar as well, and it is traditionally used for joint complaints. The evidence is mixed and many studies have small samples; the effect of the leaf tea is milder than that of the concentrated root extract."},"de":{"name":"Brennnessel","role":"Prostata · Gelenke","hatas":"Prostata-(BPH-)Symptome, Gelenke, Allergie, Harntreibung.","prep":"1–2 TL getrocknete Brennnesselblätter / Tasse, ~100 °C, 10 Minuten abgedeckt. (Bei BPH verwendeten die Studien eher den Wurzelextrakt.)","clinical":"Brennnessel(wurzel) reduzierte bei gutartiger Prostatavergrößerung (BPH) in mehreren randomisierten Studien die Harnsymptome (IPSS-Score), oft zusätzlich zur konventionellen Behandlung verabreicht. Das Brennnesselblatt zeigte günstige Anzeichen bei allergischem Schnupfen und – in kleinen Studien – auch auf den Blutzucker, und bei Gelenkbeschwerden wird es traditionell verwendet. Die Evidenz ist uneinheitlich und viele Studien haben kleine Stichproben; die Wirkung des Blättertees ist milder als die des konzentrierten Wurzelextrakts."}},"33":{"ro":{"name":"Lemn-dulce","role":"Gât · stomac","hatas":"Durere în gât, tuse, tulburări gastrice. Dulce în mod natural.","prep":"½–1 linguriță de lemn-dulce uscat și mărunțit / cană, ~100 °C, 5–10 minute. Dulce chiar și fără zahăr. Numai ocazional, pentru scurt timp!","clinical":"Lemnul-dulce este folosit în mod tradițional pentru durerea în gât, tuse și tulburări gastrice; în studii mici, de ex., a redus prin gargară durerea în gât de după operație (cauzată de intubație) și a fost studiat și în tulburările digestive. IMPORTANT: din cauza conținutului de glicirizină, consumul regulat/în cantități mari poate cauza pseudoaldosteronism – tensiune arterială crescută, nivel scăzut de potasiu, retenție de apă. De aceea este recomandat numai ocazional, pentru scurt timp.","warn":"⚠️ SERIOS: lemnul-dulce în cantități regulate sau mari crește tensiunea arterială și scade nivelul de potasiu (pseudoaldosteronism). De evitat în caz de hipertensiune arterială, boli de inimă, sarcină sau administrare de diuretice/medicamente pentru inimă."},"en":{"name":"Licorice","role":"Throat · stomach","hatas":"Sore throat, cough, stomach complaints. Naturally sweet.","prep":"½–1 tsp dried, chopped licorice / cup, ~100 °C, 5–10 minutes. Sweet even without sugar. Only occasionally, for a short time!","clinical":"Licorice is traditionally used for sore throat, cough and stomach complaints; in small studies, for example, it reduced post-operative (intubation-caused) sore throat when used as a gargle, and it has also been studied in digestive complaints. IMPORTANT: because of its glycyrrhizin content, regular/high consumption can cause pseudoaldosteronism – high blood pressure, low potassium level, water retention. Therefore it is recommended only occasionally, for a short time.","warn":"⚠️ SERIOUS: regular or large amounts of licorice raise blood pressure and lower the potassium level (pseudoaldosteronism). To be avoided in case of high blood pressure, heart disease, pregnancy, or use of diuretics/heart medication."},"de":{"name":"Süßholz","role":"Hals · Magen","hatas":"Halsschmerzen, Husten, Magenbeschwerden. Von Natur aus süß.","prep":"½–1 TL getrocknetes, zerkleinertes Süßholz / Tasse, ~100 °C, 5–10 Minuten. Auch ohne Zucker süß. Nur gelegentlich, für kurze Zeit!","clinical":"Süßholz wird traditionell bei Halsschmerzen, Husten und Magenbeschwerden verwendet; in kleinen Studien reduzierte es z. B. als Gurgellösung die postoperativen (durch Intubation verursachten) Halsschmerzen und wurde auch bei Verdauungsbeschwerden untersucht. WICHTIG: Aufgrund seines Glycyrrhizin-Gehalts kann regelmäßiger/hoher Konsum einen Pseudoaldosteronismus verursachen – Bluthochdruck, niedriger Kaliumspiegel, Wassereinlagerungen. Deshalb wird es nur gelegentlich und für kurze Zeit empfohlen.","warn":"⚠️ ERNST: regelmäßiges oder in großen Mengen konsumiertes Süßholz erhöht den Blutdruck und senkt den Kaliumspiegel (Pseudoaldosteronismus). Bei Bluthochdruck, Herzerkrankungen, Schwangerschaft oder Einnahme von Diuretika/Herzmedikamenten zu vermeiden."}}},"sourcesTr":{"ro":[{"n":"Mentă (mentă piperată)","r":"SII: metaanaliză a 12 studii randomizate (835 de pacienți); metaanaliză actualizată (2022)."},{"n":"Ceai verde","r":"Metaanalize de RCT-uri privind catechinele/EGCG (tensiune arterială, LDL, circumferința taliei, HbA1c); studii de cohortă mari (mortalitate). Siguranța extractelor: EFSA (EGCG/ficat)."},{"n":"Matcha","r":"RCT de 12 luni, dublu-orb, controlat cu placebo, 99 de vârstnici cu declin cognitiv ușor (Japonia, 2024)."},{"n":"Rooibos","r":"Studiu uman pe 40 de persoane, 6 săptămâni (lipide/redox) – Marnewick și colab., J Ethnopharmacol (2011); în majoritate date din studii pe animale."},{"n":"Salvie","r":"RCT privind bufeurile de menopauză – Bommer și colab. (2011); studiu controlat cu placebo (gargară/spray) în faringita acută."},{"n":"Soc","r":"RCT la călători cu avionul, 312 persoane – Tiralongo și colab. (2016); RCT-uri în gripă; metaanaliză (2019); RCT negativ – Macknin (2020)."},{"n":"Rozmarin","r":"RCT dublu-orb la 68 de studenți (2018); studiu doză-răspuns la vârstnici (viteza memoriei)."},{"n":"Chimen","r":"Ulei de chimen + mentă piperată în dispepsia funcțională: metaanaliză a 5 RCT-uri (578 de persoane)."},{"n":"Mușețel","r":"RCT în anxietatea generalizată – Amsterdam și colab. (2009); RCT de întreținere pe termen lung (38 de săptămâni) (2016)."},{"n":"Cimbru","r":"RCT-uri cu cimbru (adesea în asociere cu iederă) în bronșita acută/tuse."},{"n":"Sunătoare","r":"Depresie: sinteză Cochrane, 29 de studii – Linde și colab. (2008). Multe interacțiuni medicamentoase."},{"n":"Tei","r":"Utilizare tradițională; monografie europeană (EMA) a plantei. Aproape fără RCT-uri mari."},{"n":"Codițe de vișine","r":"Utilizare tradițională; studiile separate privind sucul de vișine (nu codițele) sunt favorabile."},{"n":"Roiniță","r":"Metaanaliză privind anxietatea/depresia (SMD ≈ −0,98); RCT privind anxietatea/somnul după chirurgia cardiacă."},{"n":"Măceșe","r":"Artroză: metaanaliză a 3 RCT-uri (287 de pacienți) – Christensen și colab., Osteoarthritis Cartilage (2008); finanțat de producător."},{"n":"Coada-șoricelului","r":"Utilizare tradițională; monografie EMA."},{"n":"Hibiscus","r":"Tensiune arterială: metaanaliză a 17 RCT-uri (TAS medie ≈ −7 mmHg)."},{"n":"Ginseng","r":"Oboseală: sinteză sistematică (8 RCT-uri); glicemie à jeun: metaanaliză a 16 RCT-uri."},{"n":"Reishi","r":"Sinteze ale a peste 200 de studii (oboseală/imunitate); RCT metabolic negativ de 16 săptămâni – Klupp și colab. (2016)."},{"n":"Ciuperca coama-leului","r":"RCT-uri mici pe cogniție/dispoziție (de ex. Mori 2009; Nagano 2010) – scurte, cu eșantion mic."},{"n":"Curcuma","r":"Gonartroză: metaanaliză a 16 RCT-uri (1810 persoane) (comparabilă cu AINS); sinteză care acoperă mai multe afecțiuni articulare."},{"n":"Ghimbir","r":"Greață în sarcină: metaanaliză a 12 RCT-uri (1278 de persoane); RCT privind greața indusă de chimioterapie; RCT-uri în dismenoreea primară."},{"n":"Lămâie","r":"Consum de lămâie + mers pe jos și tensiunea arterială, 101 femei (Japonia, 2014); studii mici cu suc de lămâie."},{"n":"Mentă creață","r":"RCT în SOPC/androgeni, 42 de persoane – Grant și colab. (2010); RCT de 12 săptămâni, 150 de persoane (2024)."},{"n":"Scorțișoară","r":"Metaanaliză privind glicemia/lipidele (10 RCT-uri, 543 de persoane; FPG ≈ −24 mg/dl); RCT în dismenoree. Cassia = cumarină (ficat)."},{"n":"Fenicul","r":"RCT-uri în dismenoreea primară; studiu controlat cu placebo în colicile sugarului."},{"n":"Păducel","r":"Insuficiență cardiacă cronică: sinteză Cochrane, 14 RCT-uri – Pittler și colab. (2008), ca tratament adjuvant."},{"n":"Ghimbir-lămâie-miere (rețetă)","r":"Ghimbir (metaanalize privind greața) + miere (tuse nocturnă la copii – RCT-uri, recomandare de ghid peste 1 an) + lămâie (vitamina C)."},{"n":"Valeriană","r":"Somn: sinteză sistematică, 16 RCT-uri (1093 de pacienți), Am J Med (2006); ameliorare subiectivă, cu bias de publicare."},{"n":"Floarea-pasiunii (passiflora)","r":"RCT privind somnul, 41 de persoane – Ngan \u0026 Conduit, Phytother Res (2011); sinteze privind anxietatea."},{"n":"Lavandă","r":"RCT-uri și metaanaliză cu Silexan (oral) în anxietate; comparat cu lorazepam în TAG. Ceaiul are efect mai slab."},{"n":"Cătină albă","r":"Studii clinice mici (piele, ochi, metabolism); dovezi limitate, conținut ridicat de nutrienți."},{"n":"Urzică","r":"RCT-uri dublu-orb în HBP (de ex. 100 de pacienți, 2013; 300 mg extract de rădăcină, 80 de persoane, 2022); RCT în rinita alergică."},{"n":"Lemn-dulce","r":"RCT-uri cu gargară pentru durerea de gât postoperatorie; raportări de caz privind siguranța glicirizinei (pseudoaldosteronism: tensiune arterială↑, potasiu↓)."}],"en":[{"n":"Mint (peppermint)","r":"IBS: meta-analysis of 12 randomized trials (835 patients); updated meta-analysis (2022)."},{"n":"Green tea","r":"Catechin/EGCG RCT meta-analyses (blood pressure, LDL, waist circumference, HbA1c); large cohort studies (mortality). Extract safety: EFSA (EGCG/liver)."},{"n":"Matcha","r":"12-month, double-blind, placebo-controlled RCT, 99 older adults with mild cognitive decline (Japan, 2024)."},{"n":"Rooibos","r":"Human study in 40 subjects, 6 weeks (lipids/redox) – Marnewick et al., J Ethnopharmacol (2011); mostly animal data."},{"n":"Sage","r":"Menopausal hot flush RCT – Bommer et al. (2011); placebo-controlled (gargle/spray) trial in acute pharyngitis."},{"n":"Elderberry","r":"Air-travel RCT in 312 subjects – Tiralongo et al. (2016); influenza RCTs; meta-analysis (2019); negative RCT – Macknin (2020)."},{"n":"Rosemary","r":"Double-blind RCT in 68 university students (2018); dose-response study in older adults (memory speed)."},{"n":"Caraway","r":"Caraway + peppermint oil in functional dyspepsia: meta-analysis of 5 RCTs (578 subjects)."},{"n":"Chamomile","r":"Generalized anxiety RCT – Amsterdam et al. (2009); long-term (38-week) maintenance RCT (2016)."},{"n":"Thyme","r":"Thyme (often combined with ivy) RCTs in acute bronchitis/cough."},{"n":"St. John's wort","r":"Depression: Cochrane review, 29 trials – Linde et al. (2008). Many drug interactions."},{"n":"Linden (lime blossom)","r":"Traditional use; European (EMA) herbal monograph. Hardly any large RCTs."},{"n":"Sour cherry stem","r":"Traditional use; separate studies of sour cherry juice (not the stem) are favourable."},{"n":"Lemon balm","r":"Anxiety/depression meta-analysis (SMD ≈ −0.98); RCT on anxiety/sleep after cardiac surgery."},{"n":"Rosehip","r":"Osteoarthritis: meta-analysis of 3 RCTs (287 patients) – Christensen et al., Osteoarthritis Cartilage (2008); manufacturer-funded."},{"n":"Yarrow","r":"Traditional use; EMA monograph."},{"n":"Hibiscus","r":"Blood pressure: meta-analysis of 17 RCTs (mean SBP ≈ −7 mmHg)."},{"n":"Ginseng","r":"Fatigue: systematic review (8 RCTs); fasting blood glucose: meta-analysis of 16 RCTs."},{"n":"Reishi","r":"Reviews covering 200+ studies (fatigue/immunity); negative 16-week metabolic RCT – Klupp et al. (2016)."},{"n":"Lion's mane mushroom","r":"Small cognitive/mood RCTs (e.g. Mori 2009; Nagano 2010) – short, small samples."},{"n":"Turmeric","r":"Knee osteoarthritis: meta-analysis of 16 RCTs (1810 subjects) (comparable to NSAIDs); review covering several joint disorders."},{"n":"Ginger","r":"Nausea in pregnancy: meta-analysis of 12 RCTs (1278 subjects); chemotherapy-induced nausea RCT; primary dysmenorrhoea RCTs."},{"n":"Lemon","r":"Lemon intake + walking and blood pressure, 101 women (Japan, 2014); small lemon juice studies."},{"n":"Spearmint","r":"PCOS/androgen RCT in 42 subjects – Grant et al. (2010); 12-week RCT in 150 subjects (2024)."},{"n":"Cinnamon","r":"Blood glucose/lipid meta-analysis (10 RCTs, 543 subjects; FPG ≈ −24 mg/dl); dysmenorrhoea RCT. Cassia = coumarin (liver)."},{"n":"Fennel","r":"Primary dysmenorrhoea RCTs; placebo-controlled trial in infantile colic."},{"n":"Hawthorn","r":"Chronic heart failure: Cochrane review, 14 RCTs – Pittler et al. (2008), as add-on treatment."},{"n":"Ginger-lemon-honey (recipe)","r":"Ginger (nausea meta-analyses) + honey (nocturnal cough in children – RCTs, guideline recommendation above 1 year) + lemon (vitamin C)."},{"n":"Valerian","r":"Sleep: systematic review, 16 RCTs (1093 patients), Am J Med (2006); subjective improvement, with publication bias."},{"n":"Passionflower (passiflora)","r":"Sleep RCT in 41 subjects – Ngan \u0026 Conduit, Phytother Res (2011); reviews on anxiety."},{"n":"Lavender","r":"Silexan (oral) anxiety RCTs and meta-analysis; compared with lorazepam in GAD. The tea is milder."},{"n":"Sea buckthorn","r":"Small clinical trials (skin, eye, metabolism); limited evidence, high nutrient content."},{"n":"Nettle","r":"Double-blind RCTs in BPH (e.g. 100 patients, 2013; 300 mg root extract, 80 subjects, 2022); allergic rhinitis RCT."},{"n":"Licorice","r":"Gargle RCTs for postoperative sore throat; glycyrrhizin safety case reports (pseudoaldosteronism: blood pressure↑, potassium↓)."}],"de":[{"n":"Minze (Pfefferminze)","r":"Reizdarmsyndrom: Metaanalyse von 12 randomisierten Studien (835 Patienten); aktualisierte Metaanalyse (2022)."},{"n":"Grüner Tee","r":"RCT-Metaanalysen zu Katechinen/EGCG (Blutdruck, LDL, Taillenumfang, HbA1c); große Kohortenstudien (Sterblichkeit). Extraktsicherheit: EFSA (EGCG/Leber)."},{"n":"Matcha","r":"12-monatige, doppelblinde, placebokontrollierte RCT, 99 ältere Menschen mit leichtem kognitivem Abbau (Japan, 2024)."},{"n":"Rooibos","r":"Humanstudie mit 40 Personen, 6 Wochen (Lipide/Redox) – Marnewick et al., J Ethnopharmacol (2011); überwiegend Tierversuchsdaten."},{"n":"Salbei","r":"RCT zu menopausalen Hitzewallungen – Bommer et al. (2011); placebokontrollierte Studie (Gurgellösung/Spray) bei akuter Pharyngitis."},{"n":"Holunder","r":"RCT bei Flugreisenden mit 312 Personen – Tiralongo et al. (2016); Influenza-RCTs; Metaanalyse (2019); negative RCT – Macknin (2020)."},{"n":"Rosmarin","r":"Doppelblinde RCT mit 68 Studierenden (2018); Dosis-Wirkungs-Studie bei älteren Menschen (Gedächtnisgeschwindigkeit)."},{"n":"Kümmel","r":"Kümmel- + Pfefferminzöl bei funktioneller Dyspepsie: Metaanalyse von 5 RCTs (578 Personen)."},{"n":"Kamille","r":"RCT bei generalisierter Angststörung – Amsterdam et al. (2009); langfristige (38-wöchige) Erhaltungs-RCT (2016)."},{"n":"Thymian","r":"RCTs mit Thymian (häufig mit Efeu) bei akuter Bronchitis/Husten."},{"n":"Johanniskraut","r":"Depression: Cochrane-Übersichtsarbeit, 29 Studien – Linde et al. (2008). Viele Arzneimittelwechselwirkungen."},{"n":"Linde","r":"Traditionelle Anwendung; europäische (EMA) Pflanzenmonographie. Kaum große RCTs."},{"n":"Sauerkirschstiele","r":"Traditionelle Anwendung; separate Studien zu Sauerkirschsaft (nicht zu den Stielen) sind günstig."},{"n":"Zitronenmelisse","r":"Metaanalyse zu Angst/Depression (SMD ≈ −0,98); RCT zu Angst/Schlaf nach Herzoperation."},{"n":"Hagebutte","r":"Arthrose: Metaanalyse von 3 RCTs (287 Patienten) – Christensen et al., Osteoarthritis Cartilage (2008); herstellerfinanziert."},{"n":"Schafgarbe","r":"Traditionelle Anwendung; EMA-Monographie."},{"n":"Hibiskus","r":"Blutdruck: Metaanalyse von 17 RCTs (mittlerer systolischer Blutdruck ≈ −7 mmHg)."},{"n":"Ginseng","r":"Müdigkeit: systematische Übersichtsarbeit (8 RCTs); Nüchternblutzucker: Metaanalyse von 16 RCTs."},{"n":"Reishi","r":"Übersichtsarbeiten zu über 200 Studien (Müdigkeit/Immunsystem); negative 16-wöchige metabolische RCT – Klupp et al. (2016)."},{"n":"Igelstachelbart (Löwenmähne)","r":"Kleine RCTs zu Kognition/Stimmung (z. B. Mori 2009; Nagano 2010) – kurz, kleine Stichproben."},{"n":"Kurkuma","r":"Kniearthrose: Metaanalyse von 16 RCTs (1810 Personen) (vergleichbar mit NSAR); Übersichtsarbeit zu mehreren Gelenkerkrankungen."},{"n":"Ingwer","r":"Schwangerschaftsübelkeit: Metaanalyse von 12 RCTs (1278 Personen); RCT zu Chemotherapie-bedingter Übelkeit; RCTs bei primärer Dysmenorrhoe."},{"n":"Zitrone","r":"Zitronenkonsum + Gehen und Blutdruck, 101 Frauen (Japan, 2014); kleine Zitronensaft-Studien."},{"n":"Grüne Minze (Krauseminze)","r":"PCOS-/Androgen-RCT mit 42 Personen – Grant et al. (2010); 12-wöchige RCT mit 150 Personen (2024)."},{"n":"Zimt","r":"Metaanalyse zu Blutzucker/Lipiden (10 RCTs, 543 Personen; Nüchternglukose ≈ −24 mg/dl); RCT bei Dysmenorrhoe. Cassia = Cumarin (Leber)."},{"n":"Fenchel","r":"RCTs bei primärer Dysmenorrhoe; placebokontrollierte Studie bei Säuglingskoliken."},{"n":"Weißdorn","r":"Chronische Herzinsuffizienz: Cochrane-Übersichtsarbeit, 14 RCTs – Pittler et al. (2008), als Zusatzbehandlung."},{"n":"Ingwer-Zitrone-Honig (Rezept)","r":"Ingwer (Metaanalysen zu Übelkeit) + Honig (nächtlicher Husten bei Kindern – RCTs, Leitlinienempfehlung ab 1 Jahr) + Zitrone (Vitamin C)."},{"n":"Baldrian","r":"Schlaf: systematische Übersichtsarbeit, 16 RCTs (1093 Patienten), Am J Med (2006); subjektive Verbesserung, mit Publikationsbias."},{"n":"Passionsblume (Passiflora)","r":"Schlaf-RCT mit 41 Personen – Ngan \u0026 Conduit, Phytother Res (2011); Übersichtsarbeiten zu Angst."},{"n":"Lavendel","r":"Silexan (oral): Angst-RCTs
