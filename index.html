<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" id="metaDesc" content="Gyógy-, fűszer-, gyümölcs- és gombateák: hatás, elkészítés és a mögöttük álló klinikai vizsgálatok, forráslinkekkel.">
<title>Teák – klinikai kártyák</title>
<style>
  :root{
    --ink:#e8eef7; --muted:#aab6c9; --side:300px; --topbar:58px;
    --safe-t:env(safe-area-inset-top,0px); --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  html,body{margin:0;padding:0;}
  body{min-height:100vh;min-height:100dvh;background:#0b1020;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden;}
  body::before{content:"";position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(620px 440px at 12% 18%, rgba(34,197,94,.34), transparent 60%),
      radial-gradient(720px 520px at 88% 26%, rgba(245,158,11,.30), transparent 60%),
      radial-gradient(640px 620px at 50% 92%, rgba(168,85,247,.26), transparent 60%),
      radial-gradient(520px 420px at 78% 82%, rgba(56,189,248,.22), transparent 60%),
      #0b1020;}

  /* ---------- glass-panel (Laci alap üveg-stílusa) ---------- */
  .glass{background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.045));
    border:1px solid rgba(255,255,255,.10);border-radius:20px;
    backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
    box-shadow:0 18px 50px -18px rgba(0,0,0,.75);color:var(--ink);}

  .modal.glass,.sidebar.glass{background:linear-gradient(160deg, rgba(20,28,48,.94), rgba(14,20,38,.92));}

  button,input{font-family:inherit;}
  a{color:#7dd3fc;}

  /* ---------- felső sáv ---------- */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:90;height:calc(var(--topbar) + var(--safe-t));
    padding:var(--safe-t) calc(12px + var(--safe-r)) 0 calc(12px + var(--safe-l));
    display:flex;align-items:center;gap:10px;border-radius:0;border-width:0 0 1px;}
  .menu-toggle{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 13px;
    border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink);
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);flex:0 0 auto;}
  .menu-toggle:active{background:rgba(255,255,255,.14);}
  .brand{flex:1;min-width:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .langs{display:flex;gap:4px;flex:0 0 auto;margin-left:auto;padding:3px;border-radius:12px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);}
  .lang{min-width:38px;min-height:34px;padding:6px 8px;border-radius:9px;cursor:pointer;
    font-size:12.5px;font-weight:700;letter-spacing:.4px;color:var(--muted);
    background:transparent;border:1px solid transparent;transition:background .15s,color .15s;}
  .lang:hover{color:var(--ink);background:rgba(255,255,255,.08);}
  .lang.active{color:#052e1a;background:linear-gradient(180deg,#5eead4,#34d399);border-color:transparent;}

  /* ---------- oldalsáv ---------- */
  .sidebar{position:fixed;top:calc(var(--topbar) + var(--safe-t));left:0;
    height:calc(100vh - var(--topbar) - var(--safe-t));height:calc(100dvh - var(--topbar) - var(--safe-t));
    width:var(--side);z-index:75;border-radius:0 20px 0 0;padding:14px 12px calc(12px + var(--safe-b));
    display:flex;flex-direction:column;transition:transform .32s cubic-bezier(.2,.8,.2,1);overflow:hidden;}
  body.menu-closed .sidebar{transform:translateX(-110%);}
  .side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;padding:2px 4px;}
  .side-head h2{margin:0;font-size:17px;}
  .collapse{width:38px;height:38px;border-radius:11px;cursor:pointer;font-size:20px;line-height:1;
    border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:var(--ink);flex:0 0 auto;}
  .side-sub{font-size:12px;color:var(--muted);padding:0 4px 8px;}
  .search-wrap{padding:0 4px 8px;}
  #search{width:100%;min-height:42px;padding:10px 12px;border-radius:11px;border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.06);color:var(--ink);font-size:16px;outline:none;}
  #search:focus{border-color:rgba(52,211,153,.55);}
  #search::placeholder{color:var(--muted);}
  nav{overflow-y:auto;overflow-x:hidden;flex:1;padding-right:3px;-webkit-overflow-scrolling:touch;}
  .group-label{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin:14px 8px 6px;}
  .m-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:44px;padding:9px 10px;
    border-radius:12px;cursor:pointer;margin-bottom:3px;background:transparent;border:1px solid transparent;
    color:var(--ink);font-size:14.5px;transition:background .15s ease,border-color .15s ease;}
  .m-item:hover{background:rgba(255,255,255,.06);}
  .m-item.active{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.4);}
  .m-item .em{font-size:18px;width:22px;text-align:center;flex:0 0 auto;}
  .m-item .nm{flex:1;min-width:0;}
  .m-item .st{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .st.clin{background:#34d399;box-shadow:0 0 8px rgba(52,211,153,.7);}
  .st.trad{background:#fbbf24;box-shadow:0 0 8px rgba(251,191,36,.6);}
  .no-hit{font-size:13px;color:var(--muted);padding:10px 8px;display:none;}
  .side-print{margin-top:8px;width:100%;min-height:44px;font-size:13px;font-weight:600;color:var(--ink);
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:11px;padding:11px;cursor:pointer;}
  .side-print:hover{background:rgba(255,255,255,.1);}

  .backdrop{position:fixed;inset:0;background:rgba(6,9,18,.55);z-index:70;opacity:0;pointer-events:none;transition:opacity .3s;}
  @media(max-width:900px){ body:not(.menu-closed) .backdrop{opacity:1;pointer-events:auto;} }

  /* ---------- fő tartalom ---------- */
  .main{margin-left:var(--side);
    padding:calc(var(--topbar) + var(--safe-t) + 18px) calc(20px + var(--safe-r)) calc(50px + var(--safe-b)) calc(20px + var(--safe-l));
    transition:margin .32s cubic-bezier(.2,.8,.2,1);}
  body.menu-closed .main{margin-left:0;}
  @media(max-width:900px){ .main{margin-left:0;} }

  .head{max-width:1400px;margin:0 auto 18px;padding:22px 20px;text-align:center;}
  .head h1{margin:0 0 6px;font-size:clamp(20px,4.4vw,29px);line-height:1.25;}
  .head p{margin:0;color:var(--muted);font-size:14.5px;}
  .head .hint{margin-top:12px;font-size:13px;color:var(--muted);}
  .head .hint b{color:var(--ink);}

  .goals{max-width:1400px;margin:0 auto 16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 13px;border-radius:999px;
    cursor:pointer;font-size:13.5px;color:var(--ink);background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);transition:background .15s,border-color .15s;}
  .chip:hover{background:rgba(255,255,255,.1);}
  .chip.active{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.5);}

  .grid{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:18px;align-items:stretch;}

  /* ---------- kártya (automatikus magasság: mindkét oldal ugyanabban a rácscellában) ---------- */
  .card{perspective:1400px;cursor:pointer;}
  .inner{position:relative;display:grid;width:100%;height:100%;
    transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;}
  .card.flipped .inner{transform:rotateY(180deg);}
  .face{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;
    padding:20px 18px;display:flex;flex-direction:column;min-width:0;}
  .face.back{transform:rotateY(180deg);}
  .accent{position:absolute;top:0;left:0;right:0;height:4px;border-radius:20px 20px 0 0;}
  .emoji{font-size:38px;line-height:1;margin-bottom:8px;}
  .name{font-size:19.5px;font-weight:700;margin:0;overflow-wrap:anywhere;}
  .lat{font-style:italic;color:var(--muted);font-size:13px;margin:2px 0 12px;overflow-wrap:anywhere;}
  .role{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;overflow-wrap:anywhere;}
  .hatas{font-size:14.5px;color:var(--ink);}
  .ev-badge{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;margin-top:12px;
    font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;}
  .ev-badge.clin{color:#5eead4;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.38);}
  .ev-badge.trad{color:#fcd34d;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.38);}
  .flip-tag{margin-top:auto;padding-top:12px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;}

  .back-title{font-size:17.5px;font-weight:700;overflow-wrap:anywhere;}
  .back-sub{font-size:12.5px;color:var(--muted);margin:2px 0 0;}
  .back-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .btn-prep,.btn-clin,.btn-trad{width:100%;min-height:46px;font-size:14px;font-weight:600;border-radius:12px;padding:12px;cursor:pointer;}
  .btn-prep{color:#3b2c05;background:linear-gradient(180deg,#fcd34d,#fbbf24);border:none;box-shadow:0 8px 20px -8px rgba(251,191,36,.6);}
  .btn-clin{color:#052e1a;background:linear-gradient(180deg,#5eead4,#34d399);border:none;box-shadow:0 8px 20px -8px rgba(52,211,153,.7);}
  .btn-trad{color:#fde68a;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);}
  .btn-back{margin-top:auto;width:100%;min-height:42px;font-size:12.5px;color:var(--muted);background:transparent;
    border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:10px;cursor:pointer;}

  .focus{max-width:440px;margin:0 auto;}
  .focus .emoji{font-size:50px;}
  .focus .name{font-size:25px;}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;z-index:100;background:rgba(6,9,18,.6);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;
    padding:calc(14px + var(--safe-t)) calc(14px + var(--safe-r)) calc(14px + var(--safe-b)) calc(14px + var(--safe-l));
    opacity:0;pointer-events:none;transition:opacity .28s ease;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .modal{max-width:580px;width:100%;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:24px 22px;position:relative;transform:scale(.9) translateY(12px);opacity:0;
    transition:transform .32s cubic-bezier(.2,.8,.2,1), opacity .3s ease;overscroll-behavior:contain;}
  .overlay.open .modal{transform:scale(1) translateY(0);opacity:1;}
  .modal .m-emoji{font-size:32px;line-height:1;}
  .modal h2{margin:6px 44px 2px 0;font-size:21px;overflow-wrap:anywhere;}
  .modal .m-lat{font-style:italic;color:var(--muted);font-size:13px;margin-bottom:4px;}
  .m-kicker{display:inline-block;font-size:11.5px;letter-spacing:.9px;text-transform:uppercase;border-radius:999px;
    padding:5px 12px;margin:10px 0 14px;border:1px solid transparent;}
  .m-kicker.clin{color:#34d399;border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.10);}
  .m-kicker.prep,.m-kicker.trad{color:#fbbf24;border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.10);}
  .modal p{font-size:15px;color:#eef3fb;margin:0 0 12px;}
  .modal .warn{font-size:14px;color:#fecaca;background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.35);
    border-radius:12px;padding:12px 14px;margin-bottom:14px;}
  .close{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;
    border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.10);color:var(--ink);
    font-size:22px;line-height:1;cursor:pointer;z-index:2;}

  /* ---------- vizsgálat-linkek ---------- */
  .studies{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.12);}
  .st-title{font-size:13.5px;font-weight:700;color:#5eead4;display:flex;align-items:center;gap:7px;margin-bottom:4px;}
  .st-note{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.45;}
  .st-item{padding:12px 13px;margin-bottom:10px;border-radius:12px;
    background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.24);}
  .st-item.search{background:rgba(56,189,248,.06);border-color:rgba(56,189,248,.26);}
  .st-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;}
  .st-link{display:inline-flex;align-items:center;min-height:38px;padding:8px 12px;
    border-radius:999px;text-decoration:none;font-size:12.5px;font-weight:600;color:#5eead4;white-space:nowrap;
    background:rgba(52,211,153,.10);border:1px solid rgba(52,211,153,.34);transition:background .15s,border-color .15s;}
  .st-link:hover{background:rgba(52,211,153,.2);border-color:rgba(52,211,153,.6);}
  .st-link.doi{color:#fcd34d;background:rgba(251,191,36,.10);border-color:rgba(251,191,36,.34);}
  .st-link.doi:hover{background:rgba(251,191,36,.2);}
  .st-link.oa{color:#7dd3fc;background:rgba(56,189,248,.10);border-color:rgba(56,189,248,.34);}
  .st-link.oa:hover{background:rgba(56,189,248,.2);}
  .st-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
  .st-badge{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;color:#052e1a;background:#5eead4;}
  .st-badge.alt{color:#0b1020;background:#7dd3fc;}
  .src-item .src-links a.alt{color:#7dd3fc;background:rgba(56,189,248,.08);border-color:rgba(56,189,248,.3);}
  .src-item .src-links a.doi{color:#fcd34d;background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.3);}
  .st-year{font-size:11.5px;color:var(--muted);}
  .st-lbl{font-size:13.5px;line-height:1.4;overflow-wrap:anywhere;}
  .st-src{font-size:11.5px;color:#7dd3fc;overflow-wrap:anywhere;}
  .st-empty{font-size:13px;color:var(--muted);}

  /* ---------- források oldal ---------- */
  .disclaimer{max-width:1400px;margin:26px auto 0;font-size:12.5px;color:var(--muted);text-align:center;padding:16px 18px;}
  .src-note{max-width:1400px;margin:0 auto 16px;font-size:13px;color:var(--muted);text-align:center;}
  .src-list{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:10px;}
  .src-item{padding:14px 15px;font-size:13.5px;}
  .src-item b{display:block;margin-bottom:3px;}
  .src-item .r{color:var(--muted);display:block;}
  .src-item .src-links{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;}
  .src-item .src-links a{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:7px 11px;
    border-radius:999px;font-size:12px;text-decoration:none;color:#5eead4;
    background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.3);}
  .src-item .src-links a:hover{background:rgba(52,211,153,.16);}

  /* ---------- nyomtatás ---------- */
  #printArea{display:none;}
  @media print{
    body::before{display:none;}
    .topbar,.sidebar,.menu-toggle,.main,.overlay,.backdrop{display:none!important;}
    #printArea{display:block!important;color:#000;padding:0 6mm;}
    #printArea h1{font-size:20px;margin:0 0 10px;}
    #printArea .p-tea{page-break-inside:avoid;border-bottom:1px solid #ccc;padding:8px 0;}
    #printArea h2{font-size:15px;margin:6px 0 2px;}
    #printArea .p-lat{font-style:italic;color:#444;font-size:12px;margin-bottom:4px;}
    #printArea p{font-size:12px;margin:4px 0;color:#000;line-height:1.45;}
    #printArea a{color:#0645ad;text-decoration:none;}
  }

  @media(prefers-reduced-motion:reduce){
    *{transition-duration:.01ms!important;animation-duration:.01ms!important;}
  }

  /* ---------- mobil finomhangolás ---------- */
  @media(max-width:600px){
    :root{--side:min(86vw,320px);--topbar:54px;}
    .glass{border-radius:16px;backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);
      box-shadow:0 12px 32px -14px rgba(0,0,0,.7);}
    .topbar{border-radius:0;}
    .brand{display:none;}
    .menu-toggle{padding:8px 11px;font-size:13.5px;}
    .lang{min-width:34px;padding:6px 6px;font-size:12px;}
    .main{padding-left:calc(14px + var(--safe-l));padding-right:calc(14px + var(--safe-r));
      padding-top:calc(var(--topbar) + var(--safe-t) + 14px);}
    .head{padding:18px 15px;}
    .head .hint{font-size:12.5px;}
    .face{padding:18px 16px;}
    .grid{gap:14px;grid-template-columns:1fr;}
    .goals{gap:7px;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;-webkit-overflow-scrolling:touch;
      scrollbar-width:none;padding-right:28px;
      -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);
      mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);}
    .goals::-webkit-scrollbar{display:none;}
    .chip{font-size:13px;padding:8px 11px;flex:0 0 auto;}
    .modal{padding:20px 16px;max-height:100%;}
    .modal h2{font-size:19.5px;}
    .modal p{font-size:14.5px;}
    .src-list{gap:9px;}
  }
  @media(min-width:601px) and (max-width:900px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));}
  }
</style>
</head>
<body class="menu-closed">

<header class="topbar glass">
  <button class="menu-toggle" id="menuToggle" aria-controls="sidebar" aria-expanded="false"><span aria-hidden="true">☰</span> <span id="menuToggleTxt">Menü</span></button>
  <div class="brand" id="brandTxt">🍵 Teák – klinikai kártyák</div>
  <div class="langs" id="langs" role="group" aria-label="Nyelv"></div>
</header>

<div class="backdrop" id="backdrop"></div>

<aside class="sidebar glass" id="sidebar">
  <div class="side-head"><h2 id="sideTitle">🍵 Teák</h2><button class="collapse" id="collapseBtn" aria-label="Menü bezárása">×</button></div>
  <div class="side-sub" id="sideSub"></div>
  <div class="search-wrap"><input id="search" type="search" placeholder="Keresés…" autocomplete="off" enterkeyhint="search"></div>
  <nav id="menu"></nav>
  <div class="no-hit" id="noHit"></div>
  <button class="side-print" id="printBtn"></button>
</aside>

<main class="main">
  <div id="mainContent"></div>
  <div class="disclaimer glass" id="disclaimer"></div>
</main>

<div id="printArea"></div>

<div class="overlay" id="overlay">
  <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="mName">
    <button class="close" id="closeBtn" aria-label="Bezárás">×</button>
    <div class="m-emoji" id="mEmoji"></div>
    <h2 id="mName"></h2>
    <div class="m-lat" id="mLat"></div>
    <div class="m-kicker clin" id="mKicker"></div>
    <div id="mBody"></div>
  </div>
</div>

<script id="appdata" type="application/json">{"teas":[{"name":"Menta","lat":"Mentha × piperita","emoji":"🌿","accent":"#34d399","role":"Emésztés · IBS","hatas":"Emésztés, puffadás, IBS-görcsök, fejfájás.","prep":"1–2 teáskanál szárított levél egy csészére. Frissen forralt (~100 °C) víz, 5–7 perc lefedve áztatás. Frissen a legaromásabb.","clinical":"A borsmenta legjobban kutatott formája a bélben oldódó (enteroszolvens) borsmentaolaj. 12 randomizált vizsgálat (835 beteg) metaanalízise szerint az olaj a placebónál hatékonyabban javította az irritábilis bél szindróma (IBS) globális tüneteit (kockázati arány 2,39) és a hasi fájdalmat (RR 1,78). Egy 2022-es frissített metaanalízis megerősítette, hogy jobb a placebónál, de gyakoribbak a mellékhatások (pl. reflux), és a bizonyíték minősége alacsony. A tea hatása enyhébb, mint a koncentrált kapszuláé.","q":"Mentha × piperita AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Mentha × piperita"},{"name":"Zöld tea","lat":"Camellia sinensis","emoji":"🍵","accent":"#4ade80","role":"Szív · anyagcsere","hatas":"Szív-érrendszer, vércukor, testsúly, éberség.","prep":"1 teáskanál levél / csésze, 70–80 °C (NEM lobogó!) víz, 2–3 perc. A túl forró víz keserűvé teszi.","clinical":"RCT-metaanalízisek szerint a zöld tea és katechinjei (EGCG) javíthatják a vérnyomást (főleg magasabb kiindulási értéknél) és az LDL-koleszterint, mérsékelten csökkenthetik a haskörfogatot, és javíthatják a vércukrot/HbA1c-t. Nagy kohorszvizsgálatokban a rendszeres fogyasztás alacsonyabb szív-érrendszeri és összhalálozással társult (ok-okozat nem bizonyított). FONTOS: a főzött tea biztonságos; a tömény kivonat/kapszula napi ~800 mg EGCG felett májenzim-emelkedést okozhat – étkezéssel, nem éhgyomorra.","q":"Camellia sinensis AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Camellia sinensis"},{"name":"Matcha","lat":"Camellia sinensis (őrölt)","emoji":"🍵","accent":"#22c55e","role":"Fókusz · kogníció","hatas":"Éberség, koncentráció, nyugodt fókusz (L-teanin + koffein).","prep":"1–2 g (½–1 tk) port ~80 °C vízzel habosra keversz (nem áztatás) – a teljes levelet fogyasztod, ezért töményebb.","clinical":"Egy 12 hónapos, randomizált, kettős vak, placebo-kontrollált japán vizsgálatban (99 idős, enyhe kognitív hanyatlással) a napi 2 g matcha javította a „szociális éleslátás” (arckifejezés-felismerés) pontszámot a placebóhoz képest, de a globális kogníciót és a többi funkciót nem. A korábbi vizsgálatok rövidek (kb. 12 hetesek) és kis mintásak voltak – az agyi hatás ígéretes, de eddig szerény.","q":"Camellia sinensis AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Camellia sinensis"},{"name":"Rooibos","lat":"Aspalathus linearis","emoji":"🔴","accent":"#f87171","role":"Antioxidáns · koffeinmentes","hatas":"Antioxidáns, lipidprofil, koffeinmentes.","prep":"1–2 teáskanál szárított rooibos / csésze, ~100 °C, 5–10 perc (tovább áztatva sem lesz keserű). Koffeinmentes.","clinical":"A leggyakrabban idézett emberi vizsgálatban (40 fő, szív-érrendszeri kockázattal) napi 6 csésze hagyományos rooibos 6 héten át javította a lipidprofilt (LDL- és trigliceridcsökkenés) és csökkentette a lipidperoxidációt. A bizonyíték biztató, de kevés emberi vizsgálaton és kis mintaszámon alapul – az adatok többsége állatkísérletből származik. Előny: természetesen koffeinmentes.","q":"Aspalathus linearis AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Aspalathus linearis"},{"name":"Zsálya","lat":"Salvia officinalis","emoji":"🍃","accent":"#a3e635","role":"Torok · menopauza","hatas":"Torokgyulladás, menopauzás hőhullámok, memória, izzadás.","prep":"1 teáskanál szárított levél / csésze, ~100 °C, 5–10 perc lefedve. Toroköblögetésre erősebb, kihűtött főzet.","clinical":"Randomizált, kettős vak vizsgálatokban a zsálya-készítmények jelentősen csökkentették a hőhullámok gyakoriságát és intenzitását menopauzában – egy placebo-kontrollált vizsgálatban a hőhullám-pontszám kb. 55%-kal csökkent. Egy randomizált, placebo-kontrollált vizsgálat szerint (öblögetve) hatékony és biztonságos akut garatgyulladásnál. Kisebb vizsgálatok a memóriára és hangulatra is kedvező, acetilkolin-észteráz-gátló hatást mutattak.","q":"Salvia officinalis AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Salvia officinalis"},{"name":"Bodza","lat":"Sambucus nigra","emoji":"🫐","accent":"#a78bfa","role":"Megfázás · immun","hatas":"Megfázás, influenza, felső légúti tünetek.","prep":"Bodzavirág-tea: 1–2 tk szárított virág / csésze, ~100 °C, 10 perc. A bogyót MINDIG főzve/szirupként – nyersen enyhén mérgező!","clinical":"Randomizált vizsgálatokban a standardizált bodzabogyó-kivonat lerövidítette a megfázás/influenza tüneteit. Egy 312 fős légiutas-vizsgálatban a bodza rövidebb megfázás-időtartammal és enyhébb tünetekkel járt. Kisebb vizsgálatokban az influenza tartamát kb. 3–4 nappal rövidítette, egy metaanalízis pedig a felső légúti tünetek jelentős csökkenését találta. FONTOS: az eredmények nem egységesek – egy 2020-as vizsgálat nem talált előnyt. A nyers bogyó, levél és kéreg hőkezelés nélkül mérgező.","q":"Sambucus nigra AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Sambucus nigra"},{"name":"Rozmaring","lat":"Rosmarinus officinalis","emoji":"🌱","accent":"#2dd4bf","role":"Memória · hangulat","hatas":"Memória, koncentráció, hangulat, alvás, emésztés.","prep":"1 teáskanál szárított (vagy 1 friss ágvég) / csésze, ~100 °C, 5–10 perc lefedve.","clinical":"Egy 68 fős, kettős vak randomizált vizsgálatban napi 2×500 mg rozmaring egy hónapon át javította a memóriát, csökkentette a szorongást és a depressziót, és javította az alvásminőséget egyetemistáknál. Időseknél egy vizsgálat dózisfüggő, kétirányú hatást talált: a kis dózis (750 mg) javította, a nagyon nagy dózis (6000 mg) rontotta a memória-sebességet. A tea hatása enyhébb a koncentrált kivonaténál.","q":"Rosmarinus officinalis AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Rosmarinus officinalis"},{"name":"Kömény","lat":"Carum carvi","emoji":"🌾","accent":"#fbbf24","role":"Puffadás · dyspepsia","hatas":"Puffadás, görcsös emésztés, funkcionális dyspepsia.","prep":"1 teáskanál frissen tört mag / csésze, ~100 °C, 10–15 perc lefedve (a mag törése segíti a hatóanyag kioldódását).","clinical":"A legerősebb bizonyíték a kömény- + borsmentaolaj fix kombinációjára vonatkozik funkcionális dyspepsiánál. 5 randomizált vizsgálat (578 résztvevő) metaanalízise szerint a kombináció a placebónál szignifikánsan jobban javította a dyspepsia globális tüneteit (kb. 56%-os javulás). A köménymag-teára önmagában kevesebb szigorú humán adat van – a klinikai eredmény főleg a koncentrált olajkombinációra igaz.","q":"Carum carvi AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Carum carvi"},{"name":"Kamilla","lat":"Matricaria chamomilla","emoji":"🌼","accent":"#facc15","role":"Szorongás · alvás","hatas":"Szorongás, alvás, emésztés, gyulladás, bőr (öblítés).","prep":"1–2 teáskanál szárított virág / csésze, ~100 °C, 5–10 perc lefedve. A régióban (Románia, Kárpát-medence) az egyik legfontosabb gyógynövény.","clinical":"Randomizált, kettős vak vizsgálatban a kamilla-kivonat (napi 1500 mg) 8 hét alatt jelentősen csökkentette a generalizált szorongás (GAD) tüneteit a placebóhoz képest. Egy hosszú távú (38 hetes) vizsgálatban a folytatott kamilla-kezelés alacsonyabb szorongásszintet tartott fenn (a visszaesésig eltelt idő különbsége azonban nem érte el a szignifikanciát). Metaanalízisek szerint a kamilla javíthatja a szorongást és az alvásminőséget is.","q":"Matricaria chamomilla AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Matricaria chamomilla"},{"name":"Kakukkfű","lat":"Thymus vulgaris","emoji":"🌿","accent":"#84cc16","role":"Köhögés · légutak","hatas":"Köhögés, hörghurut, felső légúti tünetek, torok.","prep":"1–2 teáskanál szárított fű / csésze, ~100 °C, 10 perc lefedve. Erdélyben/Romániában elterjedt, fontos légúti gyógynövény.","clinical":"A kakukkfüvet – gyakran borostyánnal vagy kankalinnal kombinálva – köptetőként és köhögéscsillapítóként vizsgálták. Randomizált vizsgálatokban a kakukkfű-tartalmú készítmények csökkentették az akut hörghurut és a köhögés súlyosságát/tüneteit, és általában jól tolerálhatók. Az önálló kakukkfűteára kevesebb szigorú adat van, de a légúti tüneteknél itt a legerősebb a klinikai és hagyományos bizonyíték.","q":"Thymus vulgaris AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Thymus vulgaris"},{"name":"Orbáncfű","lat":"Hypericum perforatum","emoji":"💛","accent":"#fde047","role":"Hangulat · depresszió","hatas":"Enyhe–közepes depresszió, levert hangulat. Regionálisan fontos gyógynövény.","prep":"1–2 teáskanál szárított virágos hajtás / csésze, ~100 °C, 8–10 perc lefedve.","clinical":"Az orbáncfű-kivonat az egyik legjobban vizsgált gyógynövény depresszióban. Egy Cochrane-áttekintés (29 vizsgálat) szerint a kivonatok a placebónál hatékonyabbak, a standard antidepresszánsokkal hasonlóan hatékonyak, és kevesebb mellékhatásuk van – a hatás elsősorban enyhe–közepes depressziónál egyértelmű, súlyos depresszióban vegyesebb.","warn":"⚠️ KOMOLY FIGYELMEZTETÉS: az orbáncfű számos gyógyszer hatását gyengíti (pl. fogamzásgátló, véralvadásgátló, egyes antidepresszánsok, immunszupresszánsok). Gyógyszerszedés mellett csak orvossal egyeztetve!","q":"Hypericum perforatum AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Hypericum perforatum"},{"name":"Hárs","lat":"Tilia spp.","emoji":"🌸","accent":"#fca5a5","traditional":true,"role":"Megfázás · nyugtatás","hatas":"Megfázás, izzasztás (láznál), nyugtatás, enyhe alvászavar.","prep":"1–2 teáskanál szárított hársvirág / csésze, ~100 °C, 10 perc lefedve.","tradText":"A hársvirágot hagyományosan megfázásra, izzasztásra és enyhe nyugtatásra használják; európai gyógynövény-monográfiák hagyományos használatú növényként ismerik el. Nagy, jó minőségű randomizált klinikai vizsgálat azonban alig van – a bizonyíték főként hagyományos használaton és laboratóriumi adatokon alapul.","q":"Tilia spp. AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Tilia spp."},{"name":"Meggy szár","lat":"Prunus cerasus (kocsány)","emoji":"🍒","accent":"#f472b6","traditional":true,"role":"Vízhajtó · húgyúti","hatas":"Vízhajtás, húgyúti és ízületi panaszok (népi használat).","prep":"Egy marék szárított meggyszár ~0,5 l vízben, 5–10 perc főzés (dekoktum), majd leszűrés.","tradText":"A meggyszárat (kocsányt) a népi gyógyászatban vízhajtóként, húgyúti és ízületi panaszokra használják. A szárból készült teára gyakorlatilag nincs emberi klinikai vizsgálat. (Megjegyzés: a meggylé – nem a szár – szív-anyagcsere- és alvás-hatásait vizsgálták külön, kedvező eredménnyel.)","q":"Prunus cerasus stem OR tart cherry AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Prunus cerasus stem OR tart cherry"},{"name":"Citromfű","lat":"Melissa officinalis","emoji":"🌿","accent":"#bef264","role":"Nyugtatás · alvás","hatas":"Szorongás, stressz, alvás, hangulat, emésztés.","prep":"1–2 teáskanál szárított levél / csésze, ~100 °C, 5–10 perc lefedve. Frissen is kiváló.","clinical":"Metaanalízis szerint a citromfű szignifikánsan javította a szorongás és a depresszió pontszámait a placebóhoz képest (standardizált átlagos különbség kb. −0,98). Randomizált vizsgálatokban (pl. szívműtét után) csökkentette a szorongást és javította az alvásminőséget; kis vizsgálatok a hangulatra és a kognitív teljesítményre is kedvező, GABA-rendszeren keresztüli hatást mutattak. Alvászavarra gyakran valeriánával (macskagyökér) kombinálva vizsgálták.","q":"Melissa officinalis AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Melissa officinalis"},{"name":"Csipkebogyó","lat":"Rosa canina","emoji":"🌹","accent":"#fb7185","role":"Ízületek · C-vitamin","hatas":"Ízületi (artrózis) fájdalom, C-vitamin, immun.","prep":"1–2 teáskanál szárított, tört csipkebogyó / csésze, ~100 °C, 10–15 perc lefedve (hosszabb áztatás több C-vitamint old ki).","clinical":"3 randomizált vizsgálat (287 beteg, ~3 hónap) metaanalízise szerint a csipkebogyó-por a placebónál jobban csökkentette a csípő- és térd-artrózis (osteoarthritis) fájdalmát (hatásméret 0,37), és kb. kétszer valószínűbb volt a terápiás válasz (NNT ≈ 6). A vizsgálatokat a gyártó támogatta és kis mintásak – független, nagy vizsgálat kellene a megerősítéshez. A csipkebogyó emellett kiemelkedően C-vitamin-gazdag.","q":"Rosa canina AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Rosa canina"},{"name":"Cickafark","lat":"Achillea millefolium","emoji":"🌾","accent":"#e5e7eb","traditional":true,"role":"Emésztés · sebek","hatas":"Emésztési panaszok, étvágy, enyhe görcsök, sebek, menstruáció (népi).","prep":"1–2 teáskanál szárított virágos fű / csésze, ~100 °C, 10 perc lefedve.","tradText":"A cickafarkot a népi gyógyászatban emésztési panaszokra, étvágytalanságra, enyhe görcsökre, sebekre és menstruációs panaszokra használják; európai monográfiák hagyományos használatú növényként ismerik el. Jó minőségű, nagy randomizált emberi vizsgálat azonban alig van – a bizonyíték főleg hagyományos használaton és laboratóriumi adatokon alapul.","q":"Achillea millefolium AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Achillea millefolium"},{"name":"Hibiszkusz","lat":"Hibiscus sabdariffa","emoji":"🌺","accent":"#fda4af","role":"Vérnyomás · koffeinmentes","hatas":"Vérnyomás-csökkentés, antioxidáns, savanykás, koffeinmentes.","prep":"1–2 teáskanál szárított virág(csésze-levél) / csésze, ~100 °C, 5–10 perc. Hidegen (jeges teaként) is finom.","clinical":"17 randomizált vizsgálat metaanalízise szerint a hibiszkusztea/-kivonat a placebónál jobban csökkentette a szisztolés vérnyomást (átlagosan kb. −7 Hgmm), és a hatás a magasabb vérnyomásúaknál a legnagyobb. Egyes vizsgálatokban a lipidprofilra és a vércukorra is kedvezően hatott. Kellemesen savanykás és koffeinmentes.","warn":"⚠️ Vérnyomáscsökkentő gyógyszer mellett felerősítheti a hatást (túl alacsony vérnyomás). Gyógyszerszedés esetén érdemes orvossal egyeztetni.","q":"Hibiscus sabdariffa AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Hibiscus sabdariffa"},{"name":"Ginzeng","lat":"Panax ginseng","emoji":"🥕","accent":"#fbbf24","role":"Fáradtság · vércukor","hatas":"Fáradtság, energia, vércukor, memória (adaptogén).","prep":"1 tk szárított, szeletelt gyökér / csésze, ~90 °C, 5–10 perc áztatás vagy rövid főzés. Reggel/délelőtt ajánlott.","clinical":"A Panax ginzeng az egyik legvizsgáltabb adaptogén. Fáradtságra egy szisztematikus áttekintés (8 RCT) szerint a placebónál jobb volt a fáradtság-skálákon és a klinikai hatásban. Vércukorra 16 RCT metaanalízise szerint kismértékben csökkentette az éhomi vércukrot. Kis vizsgálatok a memóriára/hangulatra és a merevedési zavarra is kedvező jeleket mutattak. A vérnyomásra vonatkozó adatok vegyesek.","warn":"⚠️ Stimuláló lehet (álmatlanság, nyugtalanság), és kölcsönhat pl. véralvadásgátlóval és cukorbetegség-gyógyszerekkel. Magas vérnyomás vagy gyógyszerszedés esetén orvossal egyeztetve.","q":"Panax ginseng AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Panax ginseng"},{"name":"Reishi (gombatea)","lat":"Ganoderma lucidum","emoji":"🍄","accent":"#c084fc","role":"Fáradtság · immun","hatas":"Fáradtság, közérzet, immunmoduláció (adaptogén gomba).","prep":"Vizes főzet (dekoktum): 3–5 g szárított, szeletelt reishi ~500 ml vízben 30–60 perc lassú forralás. Keserű – ízesíthető.","clinical":"A reishit (pecsétviaszgomba) több mint 200 klinikai vizsgálatban vizsgálták; a legjobb humán jelek a fáradtságra és az általános közérzetre vonatkoznak, immunmoduláló hatásokkal. FONTOS ellenpont: egy jó minőségű 16 hetes RCT (2-es típusú cukorbetegség + metabolikus szindróma) NEM talált érdemi javulást a HbA1c-ben, vércukorban, lipidekben vagy vérnyomásban. A hagyományos forma vizes főzet („gombatea”).","warn":"⚠️ A metabolikus (vércukor/koleszterin) előnyök jó minőségű vizsgálatban nem igazolódtak. Ritka májkárosodás-jelentések – májbetegségnél kerülendő; leszedheti a vérnyomást és véralvadásgátlóval kölcsönhat.","q":"Ganoderma lucidum AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Ganoderma lucidum"},{"name":"Oroszlánsörény-gomba","lat":"Hericium erinaceus","emoji":"🦁","accent":"#fcd34d","role":"Kogníció · hangulat","hatas":"Kognitív funkció, hangulat, közérzet (funkcionális gomba).","prep":"Vizes főzet: 3–5 g szárított gomba ~500 ml vízben 30–45 perc lassú forralás. Enyhe, tengeri-gombás íz.","clinical":"Az oroszlánsörény-gombát kis mintás klinikai vizsgálatokban vizsgálták kognitív funkcióra és hangulatra: előzetes eredmények szerint javíthatja a közérzetet, csökkentheti a szorongást/ingerlékenységet, és egyes idős, enyhe kognitív hanyatlásban szenvedőknél átmenetileg javította a kognitív pontszámokat. A vizsgálatok azonban kicsik és rövidek – az idegnövekedési faktoros (NGF) hatás emberben még nem bizonyított megbízhatóan. Gyakran vizes főzetként fogyasztják.","q":"Hericium erinaceus AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Hericium erinaceus"},{"name":"Kurkuma","lat":"Curcuma longa","emoji":"🟠","accent":"#f59e0b","role":"Ízületek · gyulladás","hatas":"Ízületi (artrózis) fájdalom, gyulladáscsökkentés, emésztés.","prep":"1 tk kurkumapor vagy néhány szelet friss gyökér / csésze, ~100 °C, 10 perc. Egy csipet FEKETE BORS (piperin) és egy kis zsír (pl. tej) sokszorosára növeli a felszívódást.","clinical":"A kurkuma hatóanyaga a kurkumin. 16 RCT (1810 felnőtt) metaanalízise szerint a kurkuma-kivonat (kb. napi 1000 mg kurkumin) a térd-artrózis fájdalmában hasonló hatású volt, mint a nem-szteroid gyulladáscsökkentők (NSAID), kevesebb gyomor-bél mellékhatással. Egy nagyobb, 29 RCT-s (2396 fő) áttekintés több ízületi betegségben is tünet- és gyulladáscsökkenést talált. FONTOS: a kurkumin felszívódása gyenge – ezért használnak fekete borsot/zsírt vagy speciális kivonatot; a teából felszívódó mennyiség kisebb, mint a vizsgálati kapszuláké.","warn":"⚠️ Nagy dózisú kurkumin-kivonat ritkán májproblémát okozhat, és kölcsönhat véralvadásgátlóval. Epekő/epeúti elzáródás esetén óvatosan.","q":"Curcuma longa AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Curcuma longa"},{"name":"Gyömbér","lat":"Zingiber officinale","emoji":"🫚","accent":"#fde047","role":"Hányinger · emésztés","hatas":"Hányinger, emésztés, menstruációs fájdalom, gyulladás.","prep":"3–4 vékony szelet friss gyömbér (vagy ½ tk por) / csésze, ~100 °C, 8–10 perc lefedve. Citrommal, mézzel ízesíthető.","clinical":"A gyömbér az egyik legjobban igazolt hányinger elleni növény. 12 RCT (1278 terhes) metaanalízise szerint jelentősen csökkentette a terhességi hányingert a placebóhoz képest. Kemoterápia okozta hányingernél is csökkentette a tüneteket (pl. egy 576 fős vizsgálatban napi ~0,5–1 g). Primer menstruációs fájdalomnál (dysmenorrhea) több RCT szerint a placebónál hatékonyabb, egyes vizsgálatokban az ibuprofenhez hasonló. Az emésztést és a gyomor-bél mozgást is fokozza.","warn":"⚠️ Terhességben általában legfeljebb ~1 g/nap ajánlott; véralvadásgátló vagy epekő esetén orvossal egyeztetve.","q":"Zingiber officinale AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Zingiber officinale"},{"name":"Citrom","lat":"Citrus limon","emoji":"🍋","accent":"#facc15","role":"C-vitamin · ízesítő","hatas":"C-vitamin, antioxidáns, ízesítő; enyhe vérnyomás-hatás.","prep":"½ citrom leve/szelete forró (nem lobogó, ~60–70 °C) vízbe – a túl forró víz csökkenti a C-vitamint. Mézzel, gyömbérrel gyakori. Reggeli meleg citromos víz népszerű.","clinical":"A citrom önálló, nagy klinikai bizonyítéka korlátozott – főleg kis vizsgálatok vannak. Egy japán vizsgálatban (101 középkorú nő) a napi citromfogyasztás + gyaloglás alacsonyabb szisztolés vérnyomással társult. Kis klinikai vizsgálatokban a citromlé enyhén csökkentette a vérnyomást (a polifenolok/flavonoidok – pl. heszperidin – és a C-vitamin révén). A citrom kiemelkedően C-vitamin- és flavonoid-gazdag, de nagy, jó minőségű RCT-k hiányoznak – az önálló hatás inkább kiegészítő/ízesítő jellegű.","q":"Citrus limon AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Citrus limon"},{"name":"Fodormenta","lat":"Mentha spicata","emoji":"🌿","accent":"#4ade80","role":"PCOS · androgén","hatas":"PCOS/androgének, hirsutizmus, emésztés.","prep":"1–2 tk szárított fodormenta / csésze, ~100 °C, 5–7 perc lefedve. PCOS-nál a vizsgálatokban napi 2 csésze.","clinical":"A fodormenta (NEM a borsmenta!) androgéncsökkentő hatását több randomizált vizsgálat is igazolta PCOS-ban. Egy 30 napos RCT-ben (42 nő) a napi 2 csésze fodormentatea jelentősen csökkentette a szabad tesztoszteront a placebóhoz képest. Egy 2024-es, 12 hetes, 150 fős vizsgálatban a legnagyobb hatás a 12. hétre alakult ki. A hormonszint gyorsan változik, de a látható szőrnövekedés-javuláshoz hosszabb idő kell (a hajszálak lassan cserélődnek). A hatás valós, de enyhébb, mint a gyógyszeres antiandrogéneké (pl. spironolakton).","q":"Mentha spicata AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Mentha spicata"},{"name":"Fahéj","lat":"Cinnamomum spp.","emoji":"🍂","accent":"#d97706","role":"Vércukor · lipidek","hatas":"Vércukor, koleszterin, menstruációs fájdalom.","prep":"½–1 tk őrölt fahéj vagy 1 fahéjrúd / csésze, ~100 °C, 10 perc. Önmagában vagy más teához keverve. Nagyobb mennyiséghez ceyloni fahéj ajánlott.","clinical":"Több RCT-metaanalízis szerint a fahéj csökkentheti az éhomi vércukrot és javíthatja a lipidprofilt, főleg cukorbetegeknél/metabolikus szindrómában. Egy 10 RCT-s (543 fő) elemzésben az éhomi vércukor kb. −24 mg/dl-rel csökkent, és a koleszterin, valamint a trigliceridek is mérséklődtek; a hatás nagyobb dózisnál (\u003e1,5 g/nap) kifejezettebb. Primer menstruációs fájdalomra is csökkentette a fájdalom erősségét és tartamát.","warn":"⚠️ A kasszia (bolti) fahéj sok kumarint tartalmaz – nagy, rendszeres mennyiségben májra terhelő lehet. Erre a célra a ceyloni fahéj biztonságosabb.","q":"Cinnamomum spp. AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Cinnamomum spp."},{"name":"Édeskömény","lat":"Foeniculum vulgare","emoji":"🌿","accent":"#a3e635","role":"Görcsök · menstruáció","hatas":"Puffadás, görcsök, menstruációs fájdalom, csecsemőkólika.","prep":"1 tk frissen tört édeskömény-mag / csésze, ~100 °C, 10–15 perc lefedve.","clinical":"Az édesköményt görcsoldó és emésztést segítő hatása miatt használják. Randomizált vizsgálatokban a primer menstruációs fájdalmat (dysmenorrhea) csökkentette a placebóhoz képest, és egy placebo-kontrollált vizsgálatban a csecsemőkólika tüneteit is enyhítette. Görcsoldó hatását méhösszehúzódásokra és bélgörcsökre laborban is igazolták. A vizsgálatok kis mintásak – nagyobb, megerősítő vizsgálatok kellenek.","q":"Foeniculum vulgare AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Foeniculum vulgare"},{"name":"Galagonya","lat":"Crataegus spp.","emoji":"🫀","accent":"#f472b6","role":"Szív · keringés","hatas":"Enyhe szívelégtelenség, keringés, vérnyomás.","prep":"1–2 tk szárított galagonya (virág + levél vagy bogyó) / csésze, ~100 °C, 10–15 perc lefedve. Bogyóból dekoktum is készíthető.","clinical":"A galagonya-kivonat az egyik legjobban vizsgált szív-gyógynövény. Egy Cochrane-áttekintés (14 kettős vak, placebo-kontrollált RCT) szerint a standard kezelés MELLÉ adva javította a krónikus szívelégtelenség tüneteit és a szív terhelhetőségét (pl. terheléses tolerancia, tünetek). Áttekintések enyhe vérnyomás- és lipidcsökkentő hatásról is beszámolnak.","warn":"⚠️ Szívgyógyszert (pl. digoxin) vagy vérnyomáscsökkentőt szedőknél kölcsönhat – csak orvossal egyeztetve. A tea a súlyos szívbetegség kezelését NEM helyettesíti. A „tejocote” néven árult mexikói hamisítványok veszélyesek lehetnek.","q":"Crataegus spp. AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Crataegus spp."},{"name":"Gyömbér-citrom-méz","lat":"Meleg gyógytea-recept","emoji":"🍯","accent":"#fbbf24","role":"Recept · megfázás","hatas":"Megfázás, torokfájás, köhögés, hányinger, C-vitamin.","prep":"Hozzávalók (1 nagy bögre): 3–4 vékony szelet friss gyömbér · ½ citrom leve · 1–2 tk méz · ~300 ml víz.\n\n1. Forrald fel a vizet a gyömbérrel, és főzd lassú tűzön 8–10 percig, lefedve.\n2. Vedd le a tűzről, és hűtsd kissé (~60–70 °C-ra).\n3. Csak a langyos teába keverd a citromlevet és a mézet (a lobogó víz csökkenti a méz és a C-vitamin értékét).\n4. Ízlés szerint egy csipet fahéj vagy kurkuma is mehet bele.","clinical":"A recept elemei külön-külön is vizsgáltak. A gyömbér több metaanalízisben csökkentette a hányingert (terhesség, kemoterápia). A méz gyermekek éjszakai köhögésénél randomizált vizsgálatokban a kezeléshiánynál/placebónál jobban enyhítette a köhögést és javította az alvást – ezért több irányelv is ajánlja (1 év felett). A citrom C-vitamin- és flavonoidforrás, a meleg folyadék pedig önmagában is enyhíti a torokfájást és az orrdugulást. FONTOS: ez tüneti enyhítés, nem gyógyítja a fertőzést.","warn":"⚠️ 1 évnél fiatalabb csecsemőnek SOHA ne adj mézet (botulizmus-veszély). Cukorbetegeknek a méz mennyiségére figyelni kell.","q":"ginger nausea OR honey cough children AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"ginger nausea OR honey cough children"},{"name":"Macskagyökér","lat":"Valeriana officinalis","emoji":"😴","accent":"#a78bfa","role":"Alvás · nyugtatás","hatas":"Elalvás, alvásminőség, nyugtatás.","prep":"1 tk szárított, aprított gyökér / csésze, ~90–100 °C, 10 perc lefedve. Lefekvés előtt ~30–60 perccel. Íze/szaga erős, jellegzetes.","clinical":"A macskagyökeret hagyományosan altatóként használják. Egy 16 RCT-t (1093 beteg) felölelő szisztematikus áttekintés szerint a valeriána javította az alvásminőséget (a javulás esélye kb. 1,8-szoros a placebóhoz képest), de a vizsgálatok módszertanilag gyengék voltak és publikációs torzítás is felmerült. Újabb áttekintések vegyesek: a szubjektív (érzékelt) alvásjavulást gyakran mutatja, objektív műszeres méréssel kevésbé. Általában biztonságos, jól tolerálható; gyakran citromfűvel/komlóval kombinálják.","q":"Valeriana officinalis AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Valeriana officinalis"},{"name":"Golgotavirág (passiflóra)","lat":"Passiflora incarnata","emoji":"🪻","accent":"#c084fc","role":"Szorongás · alvás","hatas":"Szorongás, elalvás, nyugtalanság.","prep":"1 tk szárított golgotavirág / csésze, ~100 °C, 8–10 perc lefedve. Este ajánlott.","clinical":"A golgotavirág (passiflóra) flavonoidjai a GABA-rendszeren hatnak. Egy kis, kettős vak RCT-ben (41 fő) a passiflóratea egy hét alatt javította az alvásminőséget a placebóhoz képest (átlagosan kb. 20 perccel több alvás). Szorongásra a gyógynövény-áttekintések a jobban vizsgáltak közé sorolják, szerény, placebónál nagyobb szorongáscsökkenéssel. A vizsgálatok kicsik – nagyobb, hosszú távú vizsgálatok kellenek.","q":"Passiflora incarnata AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Passiflora incarnata"},{"name":"Levendula","lat":"Lavandula angustifolia","emoji":"💜","accent":"#a78bfa","role":"Szorongás · nyugtatás","hatas":"Szorongás, nyugtalanság, alvás, hangulat.","prep":"1–2 tk szárított levendulavirág / csésze, ~100 °C, 5–8 perc lefedve. Kevés is elég – erős az aroma.","clinical":"A legerősebb bizonyíték egy standardizált, SZÁJON ÁT szedett levendulaolaj-készítményre (Silexan) van. Randomizált vizsgálatokban és metaanalízisekben a Silexan a placebónál jelentősen csökkentette a szorongást (Hamilton-szorongásskála), generalizált szorongásban a lorazepámmal/paroxetinnel összemérhető volt, függőség nélkül; enyhe–közepes depresszióban is hatásosnak bizonyult. FONTOS: ez a kapszulás olajra igaz – a levendulatea hatása enyhébb, elsősorban nyugtató/alvássegítő céllal.","warn":"⚠️ A Silexan-vizsgálatok többségét a gyártó végezte. A levendulatea hatása gyengébb, mint a standardizált kapszuláé.","q":"Lavandula angustifolia AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Lavandula angustifolia"},{"name":"Homoktövis","lat":"Hippophae rhamnoides","emoji":"🧡","accent":"#fb923c","role":"C-vitamin · bőr","hatas":"C-vitamin, antioxidáns, bőr, nyálkahártya.","prep":"1–2 tk szárított homoktövis-bogyó / csésze, ~90 °C, 10 perc; frissen préselt lével is keverhető. Nagyon savanykás, C-vitamin-gazdag.","clinical":"A homoktövis kivételesen gazdag C-vitaminban, karotinoidokban, flavonoidokban és omega-zsírsavakban. Kis klinikai vizsgálatokban a bőr hidratáltságára/gyógyulására, a szem szárazságára és egyes anyagcsere-mutatókra kedvező jeleket mutatott, és jelenleg is folynak vizsgálatok (pl. emésztés/székrekedés). A bizonyíték egyelőre korlátozott és kis mintás – nagy, jó minőségű teavizsgálatok hiányoznak; a fő értéke a magas tápanyagtartalom.","q":"Hippophae rhamnoides AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Hippophae rhamnoides"},{"name":"Csalán","lat":"Urtica dioica","emoji":"🌿","accent":"#65a30d","role":"Prosztata · ízület","hatas":"Prosztata (BPH) tünetek, ízület, allergia, vizelethajtás.","prep":"1–2 tk szárított csalánlevél / csésze, ~100 °C, 10 perc lefedve. (BPH-nál a vizsgálatok inkább a gyökérkivonatot használták.)","clinical":"A csalán(gyökér) jóindulatú prosztata-megnagyobbodásban (BPH) több randomizált vizsgálatban csökkentette a vizelési tüneteket (IPSS-pontszám), gyakran hagyományos kezelés mellé adva. A csalánlevél allergiás náthánál és – kis vizsgálatokban – a vércukorra is mutatott kedvező jeleket, ízületi panaszoknál pedig hagyományosan használják. A bizonyíték vegyes és sok vizsgálat kis mintás; a levéltea hatása enyhébb, mint a tömény gyökérkivonaté.","q":"Urtica dioica AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Urtica dioica"},{"name":"Édesgyökér","lat":"Glycyrrhiza glabra","emoji":"🍬","accent":"#a16207","role":"Torok · gyomor","hatas":"Torokfájás, köhögés, gyomorpanaszok. Természetesen édes.","prep":"½–1 tk szárított, aprított édesgyökér / csésze, ~100 °C, 5–10 perc. Cukor nélkül is édes. Csak alkalmanként, rövid ideig!","clinical":"Az édesgyökeret hagyományosan torokfájásra, köhögésre és gyomorpanaszokra használják; kis vizsgálatokban pl. a műtét utáni (intubáció okozta) torokfájást öblögetve csökkentette, és emésztési panaszoknál is vizsgálták. FONTOS: a glicirrizin-tartalma miatt a rendszeres/nagy fogyasztás áledoszteronizmust okozhat – magas vérnyomás, alacsony káliumszint, vízvisszatartás. Ezért csak alkalmanként, rövid ideig ajánlott.","warn":"⚠️ KOMOLY: rendszeres vagy nagy mennyiségű édesgyökér megemeli a vérnyomást és csökkenti a káliumszintet (áledoszteronizmus). Magas vérnyomás, szívbetegség, terhesség, vagy vízhajtó/szívgyógyszer szedése esetén kerülendő.","q":"Glycyrrhiza glabra AND (randomized controlled trial[pt] OR meta-analysis[pt] OR systematic review[pt] OR review[pt])","qname":"Glycyrrhiza glabra"}],"sources":[{"n":"Menta (borsmenta)","r":"IBS: 12 randomizált vizsgálat (835 beteg) metaanalízise; frissített metaanalízis (2022)."},{"n":"Zöld tea","r":"Katechin/EGCG RCT-metaanalízisek (vérnyomás, LDL, haskörfogat, HbA1c); nagy kohorszvizsgálatok (halálozás). Kivonat-biztonság: EFSA (EGCG/máj)."},{"n":"Matcha","r":"12 hónapos, kettős vak, placebo-kontrollált RCT, 99 idős, enyhe kognitív hanyatlás (Japán, 2024)."},{"n":"Rooibos","r":"Emberi vizsgálat 40 fő, 6 hét (lipid/redox) – Marnewick és mtsai, J Ethnopharmacol (2011); többségében állatkísérletes adatok."},{"n":"Zsálya","r":"Menopauzás hőhullám RCT – Bommer és mtsai (2011); akut garatgyulladás placebo-kontrollált (öblögetéses/spray) vizsgálat."},{"n":"Bodza","r":"Légiutas RCT 312 fő – Tiralongo és mtsai (2016); influenza RCT-k; metaanalízis (2019); negatív RCT – Macknin (2020)."},{"n":"Rozmaring","r":"Egyetemisták kettős vak RCT 68 fő (2018); idős dózis-válasz vizsgálat (memória-sebesség)."},{"n":"Kömény","r":"Kömény+borsmentaolaj funkcionális dyspepsiában: 5 RCT (578 fő) metaanalízise."},{"n":"Kamilla","r":"Generalizált szorongás RCT – Amsterdam és mtsai (2009); hosszú távú (38 hetes) fenntartó RCT (2016)."},{"n":"Kakukkfű","r":"Kakukkfű (gyakran borostyánnal) akut hörghurut/köhögés RCT-k."},{"n":"Orbáncfű","r":"Depresszió: Cochrane-áttekintés, 29 vizsgálat – Linde és mtsai (2008). Sok gyógyszer-kölcsönhatás."},{"n":"Hárs","r":"Hagyományos használat; európai (EMA) növénymonográfia. Nagy RCT alig."},{"n":"Meggy szár","r":"Hagyományos használat; a meggylé (nem a szár) külön vizsgálatai kedvezőek."},{"n":"Citromfű","r":"Szorongás/depresszió metaanalízis (SMD ≈ −0,98); szívműtét utáni szorongás/alvás RCT."},{"n":"Csipkebogyó","r":"Artrózis: 3 RCT (287 beteg) metaanalízise – Christensen és mtsai, Osteoarthritis Cartilage (2008); gyártó által támogatott."},{"n":"Cickafark","r":"Hagyományos használat; EMA-monográfia."},{"n":"Hibiszkusz","r":"Vérnyomás: 17 RCT metaanalízise (átlag SBP ≈ −7 Hgmm)."},{"n":"Ginzeng","r":"Fáradtság: szisztematikus áttekintés (8 RCT); éhomi vércukor: 16 RCT metaanalízise."},{"n":"Reishi","r":"200+ vizsgálat áttekintései (fáradtság/immun); negatív 16 hetes metabolikus RCT – Klupp és mtsai (2016)."},{"n":"Oroszlánsörény-gomba","r":"Kis kognitív/hangulat RCT-k (pl. Mori 2009; Nagano 2010) – rövidek, kis minta."},{"n":"Kurkuma","r":"Térd-artrózis: 16 RCT (1810 fő) metaanalízise (NSAID-hoz hasonló); több ízületi kórképet átfogó áttekintés."},{"n":"Gyömbér","r":"Terhességi hányinger: 12 RCT (1278 fő) metaanalízise; kemoterápiás hányinger RCT; primer dysmenorrhea RCT-k."},{"n":"Citrom","r":"Citromfogyasztás + gyaloglás és vérnyomás, 101 nő (Japán, 2014); kis citromlé-vizsgálatok."},{"n":"Fodormenta","r":"PCOS/androgén RCT 42 fő – Grant és mtsai (2010); 12 hetes RCT 150 fő (2024)."},{"n":"Fahéj","r":"Vércukor/lipid metaanalízis (10 RCT, 543 fő; FPG ≈ −24 mg/dl); dysmenorrhea RCT. Kasszia = kumarin (máj)."},{"n":"Édeskömény","r":"Primer dysmenorrhea RCT-k; csecsemőkólika placebo-kontrollált vizsgálat."},{"n":"Galagonya","r":"Krónikus szívelégtelenség: Cochrane-áttekintés, 14 RCT – Pittler és mtsai (2008), kiegészítő kezelésként."},{"n":"Gyömbér-citrom-méz (recept)","r":"Gyömbér (hányinger-metaanalízisek) + méz (gyermekek éjszakai köhögése – RCT-k, irányelvi ajánlás 1 év felett) + citrom (C-vitamin)."},{"n":"Macskagyökér","r":"Alvás: szisztematikus áttekintés, 16 RCT (1093 beteg), Am J Med (2006); szubjektív javulás, publikációs torzítással."},{"n":"Golgotavirág (passiflóra)","r":"Alvás RCT 41 fő – Ngan \u0026 Conduit, Phytother Res (2011); szorongás-áttekintések."},{"n":"Levendula","r":"Silexan (szájon át) szorongás RCT-k és metaanalízis; GAD-ban lorazepámmal összevetve. A tea enyhébb."},{"n":"Homoktövis","r":"Kis klinikai vizsgálatok (bőr, szem, anyagcsere); korlátozott bizonyíték, magas tápanyagtartalom."},{"n":"Csalán","r":"BPH kettős vak RCT-k (pl. 100 beteg, 2013; 300 mg gyökérkivonat, 80 fő, 2022); allergiás nátha RCT."},{"n":"Édesgyökér","r":"Műtét utáni torokfájás öblögetéses RCT-k; glicirrizin biztonsági esetriportok (áledoszteronizmus: vérnyomás↑, kálium↓)."}],"tagMap":{"0":["digestion","pain"],"1":["cardio","glucose","mood"],"2":["cognition","mood"],"3":["cardio","immune"],"4":["respiratory","women","cognition"],"5":["cold","immune"],"6":["cognition","mood","sleep"],"7":["digestion"],"8":["sleep","calm","digestion"],"9":["cold","respiratory"],"10":["mood"],"11":["cold","calm"],"12":["other"],"13":["sleep","calm","mood"],"14":["pain","immune"],"15":["digestion"],"16":["cardio"],"17":["mood","glucose"],"18":["immune","mood"],"19":["cognition","mood"],"20":["pain"],"21":["digestion","pain","women"],"22":["immune","cardio"],"23":["women","digestion"],"24":["glucose","women"],"25":["digestion","women"],"26":["cardio"],"27":["cold","respiratory","digestion"],"28":["sleep","calm"],"29":["sleep","calm"],"30":["calm","sleep","mood"],"31":["immune"],"32":["pain","other"],"33":["respiratory","digestion"]},"tr":{"0":{"ro":{"name":"Mentă","role":"Digestie · SII","hatas":"Digestie, balonare, crampe în SII, dureri de cap.","prep":"1–2 lingurițe de frunze uscate la o ceașcă. Apă proaspăt fiartă (~100 °C), infuzare 5–7 minute acoperit. Cea mai aromată proaspătă.","clinical":"Cea mai bine cercetată formă a mentei este uleiul de mentă cu eliberare enterică (enterosolubil). Conform unei metaanalize a 12 studii randomizate (835 de pacienți), uleiul a ameliorat mai eficient decât placebo simptomele globale ale sindromului de intestin iritabil (SII) (raport de risc 2,39) și durerea abdominală (RR 1,78). O metaanaliză actualizată din 2022 a confirmat că este superior placebo, dar reacțiile adverse (de ex. refluxul) sunt mai frecvente, iar calitatea dovezilor este scăzută. Efectul ceaiului este mai blând decât cel al capsulelor concentrate."},"en":{"name":"Peppermint","role":"Digestion · IBS","hatas":"Digestion, bloating, IBS cramps, headache.","prep":"1–2 teaspoons of dried leaf per cup. Freshly boiled (~100 °C) water, steep covered for 5–7 minutes. Most aromatic when fresh.","clinical":"The best-researched form of peppermint is enteric-coated (enterosoluble) peppermint oil. According to a meta-analysis of 12 randomized trials (835 patients), the oil improved global symptoms of irritable bowel syndrome (IBS) more effectively than placebo (risk ratio 2.39) and abdominal pain (RR 1.78). An updated 2022 meta-analysis confirmed that it is superior to placebo, but adverse effects (e.g. reflux) are more common and the quality of evidence is low. The effect of the tea is milder than that of concentrated capsules."},"de":{"name":"Pfefferminze","role":"Verdauung · Reizdarm","hatas":"Verdauung, Blähungen, Reizdarm-Krämpfe, Kopfschmerzen.","prep":"1–2 Teelöffel getrocknete Blätter pro Tasse. Frisch aufgekochtes (~100 °C) Wasser, 5–7 Minuten zugedeckt ziehen lassen. Am aromatischsten frisch.","clinical":"Die am besten erforschte Form der Pfefferminze ist magensaftresistentes (enterolösliches) Pfefferminzöl. Laut einer Metaanalyse von 12 randomisierten Studien (835 Patienten) verbesserte das Öl die globalen Symptome des Reizdarmsyndroms (RDS) wirksamer als Placebo (Risikoverhältnis 2,39) sowie die Bauchschmerzen (RR 1,78). Eine aktualisierte Metaanalyse von 2022 bestätigte die Überlegenheit gegenüber Placebo, jedoch sind Nebenwirkungen (z. B. Reflux) häufiger und die Qualität der Evidenz ist niedrig. Die Wirkung des Tees ist milder als die konzentrierter Kapseln."}},"1":{"ro":{"name":"Ceai verde","role":"Inimă · metabolism","hatas":"Sistem cardiovascular, glicemie, greutate corporală, vigilență.","prep":"1 linguriță de frunze / ceașcă, apă la 70–80 °C (NU clocotită!), 2–3 minute. Apa prea fierbinte îl face amar.","clinical":"Conform metaanalizelor de studii RCT, ceaiul verde și catechinele sale (EGCG) pot ameliora tensiunea arterială (mai ales la valori inițiale mai ridicate) și colesterolul LDL, pot reduce moderat circumferința taliei și pot îmbunătăți glicemia/HbA1c. În studiile de cohortă mari, consumul regulat a fost asociat cu o mortalitate cardiovasculară și generală mai scăzută (relația cauză-efect nu este dovedită). IMPORTANT: ceaiul preparat este sigur; extractul/capsula concentrat(ă) peste ~800 mg EGCG pe zi poate provoca creșterea enzimelor hepatice – de luat cu masa, nu pe stomacul gol."},"en":{"name":"Green tea","role":"Heart · metabolism","hatas":"Cardiovascular system, blood sugar, body weight, alertness.","prep":"1 teaspoon of leaf / cup, water at 70–80 °C (NOT boiling!), 2–3 minutes. Water that is too hot makes it bitter.","clinical":"According to meta-analyses of RCTs, green tea and its catechins (EGCG) may improve blood pressure (especially at higher baseline values) and LDL cholesterol, moderately reduce waist circumference, and improve blood sugar/HbA1c. In large cohort studies, regular consumption was associated with lower cardiovascular and all-cause mortality (causation not proven). IMPORTANT: brewed tea is safe; concentrated extract/capsules above ~800 mg EGCG per day can cause elevated liver enzymes – take with food, not on an empty stomach."},"de":{"name":"Grüner Tee","role":"Herz · Stoffwechsel","hatas":"Herz-Kreislauf-System, Blutzucker, Körpergewicht, Wachheit.","prep":"1 Teelöffel Blätter / Tasse, Wasser bei 70–80 °C (NICHT kochend!), 2–3 Minuten. Zu heißes Wasser macht ihn bitter.","clinical":"Laut Metaanalysen von RCT-Studien können grüner Tee und seine Katechine (EGCG) den Blutdruck (vor allem bei höheren Ausgangswerten) und das LDL-Cholesterin verbessern, den Taillenumfang mäßig verringern und den Blutzucker/HbA1c verbessern. In großen Kohortenstudien war der regelmäßige Konsum mit einer niedrigeren kardiovaskulären und Gesamtsterblichkeit verbunden (Kausalität nicht bewiesen). WICHTIG: Der aufgebrühte Tee ist sicher; konzentrierter Extrakt/Kapseln über ~800 mg EGCG pro Tag können einen Anstieg der Leberenzyme verursachen – mit dem Essen, nicht auf nüchternen Magen einnehmen."}},"2":{"ro":{"name":"Matcha","role":"Concentrare · cogniție","hatas":"Vigilență, concentrare, focalizare calmă (L-teanină + cofeină).","prep":"1–2 g (½–1 linguriță) de pudră se amestecă cu apă la ~80 °C până la spumare (nu infuzare) – consumi întreaga frunză, de aceea este mai concentrat.","clinical":"Într-un studiu japonez randomizat, dublu-orb, controlat cu placebo, de 12 luni (99 de vârstnici cu declin cognitiv ușor), 2 g de matcha pe zi a îmbunătățit scorul de „acuitate socială” (recunoașterea expresiilor faciale) față de placebo, dar nu și cogniția globală și celelalte funcții. Studiile anterioare au fost scurte (aproximativ 12 săptămâni) și cu eșantioane mici – efectul cerebral este promițător, dar până acum modest."},"en":{"name":"Matcha","role":"Focus · cognition","hatas":"Alertness, concentration, calm focus (L-theanine + caffeine).","prep":"1–2 g (½–1 tsp) of powder whisked with ~80 °C water until frothy (not steeped) – you consume the whole leaf, so it is more concentrated.","clinical":"In a 12-month randomized, double-blind, placebo-controlled Japanese study (99 elderly people with mild cognitive decline), 2 g of matcha per day improved the \"social acuity\" (facial expression recognition) score compared to placebo, but not global cognition or the other functions. Earlier studies were short (about 12 weeks) and small in sample size – the effect on the brain is promising but so far modest."},"de":{"name":"Matcha","role":"Fokus · Kognition","hatas":"Wachheit, Konzentration, ruhiger Fokus (L-Theanin + Koffein).","prep":"1–2 g (½–1 TL) Pulver mit ~80 °C warmem Wasser schaumig schlagen (kein Ziehenlassen) – du konsumierst das ganze Blatt, daher ist er konzentrierter.","clinical":"In einer 12-monatigen randomisierten, doppelblinden, placebokontrollierten japanischen Studie (99 ältere Menschen mit leichtem kognitivem Abbau) verbesserte 2 g Matcha pro Tag den Wert der „sozialen Wahrnehmungsschärfe“ (Erkennen von Gesichtsausdrücken) gegenüber Placebo, jedoch nicht die globale Kognition und die übrigen Funktionen. Die früheren Studien waren kurz (etwa 12 Wochen) und hatten kleine Stichproben – die Wirkung auf das Gehirn ist vielversprechend, bisher aber bescheiden."}},"3":{"ro":{"name":"Rooibos","role":"Antioxidant · fără cofeină","hatas":"Antioxidant, profil lipidic, fără cofeină.","prep":"1–2 lingurițe de rooibos uscat / ceașcă, ~100 °C, 5–10 minute (nu devine amar nici dacă se infuzează mai mult). Fără cofeină.","clinical":"În cel mai frecvent citat studiu pe oameni (40 de persoane cu risc cardiovascular), 6 cești pe zi de rooibos tradițional timp de 6 săptămâni au îmbunătățit profilul lipidic (scăderea LDL și a trigliceridelor) și au redus peroxidarea lipidică. Dovezile sunt încurajatoare, dar se bazează pe puține studii pe oameni și pe eșantioane mici – majoritatea datelor provin din experimente pe animale. Avantaj: în mod natural fără cofeină."},"en":{"name":"Rooibos","role":"Antioxidant · caffeine-free","hatas":"Antioxidant, lipid profile, caffeine-free.","prep":"1–2 teaspoons of dried rooibos / cup, ~100 °C, 5–10 minutes (it does not become bitter even with longer steeping). Caffeine-free.","clinical":"In the most frequently cited human study (40 people with cardiovascular risk), 6 cups per day of traditional rooibos for 6 weeks improved the lipid profile (reduction of LDL and triglycerides) and reduced lipid peroxidation. The evidence is encouraging but is based on few human studies and small sample sizes – most of the data comes from animal experiments. Advantage: naturally caffeine-free."},"de":{"name":"Rooibos","role":"Antioxidans · koffeinfrei","hatas":"Antioxidans, Lipidprofil, koffeinfrei.","prep":"1–2 Teelöffel getrockneter Rooibos / Tasse, ~100 °C, 5–10 Minuten (wird auch bei längerem Ziehen nicht bitter). Koffeinfrei.","clinical":"In der am häufigsten zitierten Humanstudie (40 Personen mit kardiovaskulärem Risiko) verbesserten 6 Tassen traditioneller Rooibos pro Tag über 6 Wochen das Lipidprofil (Senkung von LDL und Triglyceriden) und reduzierten die Lipidperoxidation. Die Evidenz ist ermutigend, beruht aber auf wenigen Humanstudien und kleinen Stichproben – der Großteil der Daten stammt aus Tierversuchen. Vorteil: von Natur aus koffeinfrei."}},"4":{"ro":{"name":"Salvie","role":"Gât · menopauză","hatas":"Inflamația gâtului, bufeuri de menopauză, memorie, transpirație.","prep":"1 linguriță de frunze uscate / ceașcă, ~100 °C, 5–10 minute acoperit. Pentru gargară, un decoct mai concentrat și răcit.","clinical":"În studii randomizate, dublu-orb, preparatele pe bază de salvie au redus semnificativ frecvența și intensitatea bufeurilor la menopauză – într-un studiu controlat cu placebo, scorul bufeurilor a scăzut cu aproximativ 55%. Conform unui studiu randomizat, controlat cu placebo, este eficientă și sigură (în gargară) în faringita acută. Studii mai mici au arătat și un efect favorabil asupra memoriei și dispoziției, cu inhibarea acetilcolinesterazei."},"en":{"name":"Sage","role":"Throat · menopause","hatas":"Sore throat, menopausal hot flashes, memory, sweating.","prep":"1 teaspoon of dried leaf / cup, ~100 °C, 5–10 minutes covered. For gargling, a stronger, cooled decoction.","clinical":"In randomized, double-blind studies, sage preparations significantly reduced the frequency and intensity of hot flashes in menopause – in a placebo-controlled study, the hot flash score decreased by about 55%. According to a randomized, placebo-controlled study, it is effective and safe (as a gargle) in acute pharyngitis. Smaller studies also showed a favorable effect on memory and mood, with acetylcholinesterase-inhibiting action."},"de":{"name":"Salbei","role":"Hals · Wechseljahre","hatas":"Halsentzündung, Hitzewallungen in den Wechseljahren, Gedächtnis, Schwitzen.","prep":"1 Teelöffel getrocknete Blätter / Tasse, ~100 °C, 5–10 Minuten zugedeckt. Zum Gurgeln ein stärkerer, abgekühlter Aufguss.","clinical":"In randomisierten, doppelblinden Studien reduzierten Salbeipräparate die Häufigkeit und Intensität der Hitzewallungen in den Wechseljahren deutlich – in einer placebokontrollierten Studie sank der Hitzewallungs-Score um etwa 55%. Laut einer randomisierten, placebokontrollierten Studie ist er (als Gurgellösung) wirksam und sicher bei akuter Rachenentzündung. Kleinere Studien zeigten auch eine günstige Wirkung auf Gedächtnis und Stimmung mit acetylcholinesterasehemmender Wirkung."}},"5":{"ro":{"name":"Soc","role":"Răceală · imunitate","hatas":"Răceală, gripă, simptome ale căilor respiratorii superioare.","prep":"Ceai din flori de soc: 1–2 lingurițe de flori uscate / ceașcă, ~100 °C, 10 minute. Fructele ÎNTOTDEAUNA fierte/sub formă de sirop – crude sunt ușor toxice!","clinical":"În studii randomizate, extractul standardizat de fructe de soc a scurtat durata simptomelor de răceală/gripă. Într-un studiu pe 312 pasageri de avion, socul a fost asociat cu o durată mai scurtă a răcelii și cu simptome mai ușoare. În studii mai mici a scurtat durata gripei cu aproximativ 3–4 zile, iar o metaanaliză a constatat o reducere semnificativă a simptomelor căilor respiratorii superioare. IMPORTANT: rezultatele nu sunt uniforme – un studiu din 2020 nu a găsit niciun beneficiu. Fructele crude, frunzele și scoarța sunt toxice fără tratament termic."},"en":{"name":"Elderberry","role":"Cold · immunity","hatas":"Cold, flu, upper respiratory symptoms.","prep":"Elderflower tea: 1–2 tsp of dried flowers / cup, ~100 °C, 10 minutes. The berries ALWAYS cooked/as syrup – raw they are slightly toxic!","clinical":"In randomized trials, standardized elderberry extract shortened the duration of cold/flu symptoms. In a study of 312 air travelers, elderberry was associated with a shorter cold duration and milder symptoms. In smaller studies it shortened the duration of flu by about 3–4 days, and a meta-analysis found a significant reduction in upper respiratory symptoms. IMPORTANT: the results are not consistent – a 2020 study found no benefit. Raw berries, leaves and bark are toxic without heat treatment."},"de":{"name":"Holunder","role":"Erkältung · Immunsystem","hatas":"Erkältung, Grippe, Symptome der oberen Atemwege.","prep":"Holunderblütentee: 1–2 TL getrocknete Blüten / Tasse, ~100 °C, 10 Minuten. Die Beeren IMMER gekocht/als Sirup – roh sind sie leicht giftig!","clinical":"In randomisierten Studien verkürzte der standardisierte Holunderbeerenextrakt die Dauer der Erkältungs-/Grippesymptome. In einer Studie mit 312 Flugreisenden ging Holunder mit einer kürzeren Erkältungsdauer und milderen Symptomen einher. In kleineren Studien verkürzte er die Grippedauer um etwa 3–4 Tage, und eine Metaanalyse fand eine signifikante Verringerung der Symptome der oberen Atemwege. WICHTIG: Die Ergebnisse sind nicht einheitlich – eine Studie von 2020 fand keinen Nutzen. Rohe Beeren, Blätter und Rinde sind ohne Hitzebehandlung giftig."}},"6":{"ro":{"name":"Rozmarin","role":"Memorie · dispoziție","hatas":"Memorie, concentrare, dispoziție, somn, digestie.","prep":"1 linguriță uscat (sau 1 vârf de ramură proaspătă) / ceașcă, ~100 °C, 5–10 minute acoperit.","clinical":"Într-un studiu randomizat, dublu-orb, pe 68 de persoane, 2×500 mg de rozmarin pe zi timp de o lună a îmbunătățit memoria, a redus anxietatea și depresia și a îmbunătățit calitatea somnului la studenți. La vârstnici, un studiu a constatat un efect dependent de doză, bidirecțional: doza mică (750 mg) a îmbunătățit, iar doza foarte mare (6000 mg) a înrăutățit viteza memoriei. Efectul ceaiului este mai blând decât cel al extractului concentrat."},"en":{"name":"Rosemary","role":"Memory · mood","hatas":"Memory, concentration, mood, sleep, digestion.","prep":"1 teaspoon dried (or 1 fresh sprig tip) / cup, ~100 °C, 5–10 minutes covered.","clinical":"In a double-blind randomized study of 68 people, 2×500 mg of rosemary per day for one month improved memory, reduced anxiety and depression, and improved sleep quality in university students. In the elderly, one study found a dose-dependent, bidirectional effect: the low dose (750 mg) improved, while the very high dose (6000 mg) worsened memory speed. The effect of the tea is milder than that of the concentrated extract."},"de":{"name":"Rosmarin","role":"Gedächtnis · Stimmung","hatas":"Gedächtnis, Konzentration, Stimmung, Schlaf, Verdauung.","prep":"1 Teelöffel getrocknet (oder 1 frische Zweigspitze) / Tasse, ~100 °C, 5–10 Minuten zugedeckt.","clinical":"In einer doppelblinden randomisierten Studie mit 68 Personen verbesserte 2×500 mg Rosmarin pro Tag über einen Monat das Gedächtnis, verringerte Angst und Depression und verbesserte die Schlafqualität bei Studierenden. Bei älteren Menschen fand eine Studie einen dosisabhängigen, zweiseitigen Effekt: Die niedrige Dosis (750 mg) verbesserte, die sehr hohe Dosis (6000 mg) verschlechterte die Gedächtnisgeschwindigkeit. Die Wirkung des Tees ist milder als die des konzentrierten Extrakts."}},"7":{"ro":{"name":"Chimen","role":"Balonare · dispepsie","hatas":"Balonare, digestie cu crampe, dispepsie funcțională.","prep":"1 linguriță de semințe proaspăt zdrobite / ceașcă, ~100 °C, 10–15 minute acoperit (zdrobirea semințelor ajută extragerea principiului activ).","clinical":"Cele mai solide dovezi se referă la combinația fixă de ulei de chimen + ulei de mentă în dispepsia funcțională. Conform unei metaanalize a 5 studii randomizate (578 de participanți), combinația a ameliorat semnificativ mai mult decât placebo simptomele globale ale dispepsiei (aproximativ 56% ameliorare). Pentru ceaiul de semințe de chimen în sine există mai puține date umane riguroase – rezultatul clinic este valabil mai ales pentru combinația de uleiuri concentrate."},"en":{"name":"Caraway","role":"Bloating · dyspepsia","hatas":"Bloating, cramping digestion, functional dyspepsia.","prep":"1 teaspoon of freshly crushed seeds / cup, ~100 °C, 10–15 minutes covered (crushing the seeds helps release the active compounds).","clinical":"The strongest evidence concerns the fixed combination of caraway + peppermint oil in functional dyspepsia. According to a meta-analysis of 5 randomized trials (578 participants), the combination improved the global symptoms of dyspepsia significantly more than placebo (about 56% improvement). For caraway seed tea on its own there is less rigorous human data – the clinical result applies mainly to the concentrated oil combination."},"de":{"name":"Kümmel","role":"Blähungen · Dyspepsie","hatas":"Blähungen, krampfartige Verdauung, funktionelle Dyspepsie.","prep":"1 Teelöffel frisch zerstoßene Samen / Tasse, ~100 °C, 10–15 Minuten zugedeckt (das Zerstoßen der Samen fördert das Herauslösen des Wirkstoffs).","clinical":"Die stärkste Evidenz betrifft die feste Kombination aus Kümmel- + Pfefferminzöl bei funktioneller Dyspepsie. Laut einer Metaanalyse von 5 randomisierten Studien (578 Teilnehmer) verbesserte die Kombination die globalen Symptome der Dyspepsie signifikant stärker als Placebo (etwa 56% Besserung). Für Kümmelsamentee allein gibt es weniger strenge Humandaten – das klinische Ergebnis gilt vor allem für die konzentrierte Ölkombination."}},"8":{"ro":{"name":"Mușețel","role":"Anxietate · somn","hatas":"Anxietate, somn, digestie, inflamație, piele (spălare).","prep":"1–2 lingurițe de flori uscate / ceașcă, ~100 °C, 5–10 minute acoperit. În regiune (România, Bazinul Carpatic) este una dintre cele mai importante plante medicinale.","clinical":"Într-un studiu randomizat, dublu-orb, extractul de mușețel (1500 mg pe zi) a redus semnificativ simptomele anxietății generalizate (GAD) în 8 săptămâni, comparativ cu placebo. Într-un studiu pe termen lung (38 de săptămâni), continuarea tratamentului cu mușețel a menținut un nivel mai scăzut de anxietate (diferența în timpul până la recădere nu a atins însă semnificația). Conform metaanalizelor, mușețelul poate ameliora atât anxietatea, cât și calitatea somnului."},"en":{"name":"Chamomile","role":"Anxiety · sleep","hatas":"Anxiety, sleep, digestion, inflammation, skin (rinse).","prep":"1–2 teaspoons of dried flowers / cup, ~100 °C, 5–10 minutes covered. In the region (Romania, Carpathian Basin) it is one of the most important medicinal herbs.","clinical":"In a randomized, double-blind study, chamomile extract (1500 mg per day) significantly reduced the symptoms of generalized anxiety disorder (GAD) over 8 weeks compared to placebo. In a long-term (38-week) study, continued chamomile treatment maintained a lower level of anxiety (although the difference in time to relapse did not reach significance). According to meta-analyses, chamomile may improve both anxiety and sleep quality."},"de":{"name":"Kamille","role":"Angst · Schlaf","hatas":"Angst, Schlaf, Verdauung, Entzündung, Haut (Spülung).","prep":"1–2 Teelöffel getrocknete Blüten / Tasse, ~100 °C, 5–10 Minuten zugedeckt. In der Region (Rumänien, Karpatenbecken) ist sie eine der wichtigsten Heilpflanzen.","clinical":"In einer randomisierten, doppelblinden Studie reduzierte der Kamillenextrakt (1500 mg pro Tag) die Symptome der generalisierten Angststörung (GAD) über 8 Wochen signifikant gegenüber Placebo. In einer Langzeitstudie (38 Wochen) hielt die fortgesetzte Kamillenbehandlung ein niedrigeres Angstniveau aufrecht (der Unterschied in der Zeit bis zum Rückfall erreichte jedoch keine Signifikanz). Laut Metaanalysen kann Kamille sowohl die Angst als auch die Schlafqualität verbessern."}},"9":{"ro":{"name":"Cimbru","role":"Tuse · căi respiratorii","hatas":"Tuse, bronșită, simptome ale căilor respiratorii superioare, gât.","prep":"1–2 lingurițe de plantă uscată la o cană, apă la ~100 °C, infuzare acoperită 10 minute. Răspândit în Transilvania/România, plantă medicinală importantă pentru căile respiratorii.","clinical":"Cimbrul – adesea combinat cu iederă sau cu ciuboțica-cucului – a fost studiat ca expectorant și antitusiv. În studii randomizate, preparatele care conțin cimbru au redus severitatea/simptomele bronșitei acute și ale tusei și sunt în general bine tolerate. Pentru ceaiul de cimbru administrat singur există mai puține date riguroase, dar la simptomele respiratorii aici dovezile clinice și tradiționale sunt cele mai puternice."},"en":{"name":"Thyme","role":"Cough · airways","hatas":"Cough, bronchitis, upper respiratory symptoms, throat.","prep":"1–2 teaspoons of dried herb per cup, water at ~100 °C, steep covered for 10 minutes. Widespread in Transylvania/Romania, an important respiratory medicinal herb.","clinical":"Thyme – often combined with ivy or cowslip (primrose) – has been studied as an expectorant and cough suppressant. In randomized trials, thyme-containing preparations reduced the severity/symptoms of acute bronchitis and cough, and are generally well tolerated. There are fewer rigorous data on thyme tea alone, but for respiratory symptoms the clinical and traditional evidence is strongest here."},"de":{"name":"Thymian","role":"Husten · Atemwege","hatas":"Husten, Bronchitis, Symptome der oberen Atemwege, Hals.","prep":"1–2 Teelöffel getrocknetes Kraut pro Tasse, Wasser mit ~100 °C, 10 Minuten abgedeckt ziehen lassen. In Siebenbürgen/Rumänien weit verbreitet, wichtige Atemwegs-Heilpflanze.","clinical":"Thymian – oft mit Efeu oder Schlüsselblume kombiniert – wurde als Expektorans und Hustenstiller untersucht. In randomisierten Studien verringerten thymianhaltige Präparate die Schwere/Symptome der akuten Bronchitis und des Hustens und sind im Allgemeinen gut verträglich. Zu Thymiantee allein gibt es weniger belastbare Daten, doch bei Atemwegssymptomen ist die klinische und traditionelle Evidenz hier am stärksten."}},"10":{"ro":{"name":"Sunătoare","role":"Dispoziție · depresie","hatas":"Depresie ușoară–moderată, dispoziție deprimată. Plantă medicinală importantă regional.","prep":"1–2 lingurițe de lăstari înfloriți uscați la o cană, apă la ~100 °C
